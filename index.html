<script>
'use strict';
const P = {"salt":"jp9M+N22eHzCoW5FKA1ZRA==","iv":"Xj15HRSdVPEqxnQc","iter":600000,"v":1};
const KEY = 'altesia-cle-page';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function open(key) {
  const gz = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(document.getElementById('payload').textContent.trim())));
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
}
async function remembered() {
  try { const r = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!r || r.salt !== P.salt) return false;
    const k = await crypto.subtle.importKey('raw', u8(r.k), 'AES-GCM', false, ['decrypt']); await open(k); return true; } catch (e) { return false; }
}
document.getElementById('f').addEventListener('submit', async ev => {
  ev.preventDefault();
  const b = document.getElementById('b'), e = document.getElementById('e'), pw = document.getElementById('pw').value;
  if (!pw) return; b.disabled = true; b.textContent = 'Déverrouillage…'; e.textContent = '';
  try {
    const k = await derive(pw);
    if (document.getElementById('rm').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', k)); let s = ''; raw.forEach(x => s += String.fromCharCode(x));
      try { localStorage.setItem(KEY, JSON.stringify({ salt: P.salt, k: btoa(s) })); } catch (x) { /* stockage indisponible */ }
    }
    window.__altesiaPw = pw;   // transmis à la suite (en mémoire uniquement) pour recharger les sauvegardes chiffrées avec la même phrase
    await open(k);
  } catch (x) { b.disabled = false; b.textContent = 'Ouvrir'; e.textContent = 'Phrase de passe incorrecte.'; }
});
remembered();
</script>
