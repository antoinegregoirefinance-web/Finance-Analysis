}
const inp = (path, v, kind = 'num', extra = '') => {
  const shown = kind === 'pct' ? +(v * 100).toFixed(2) : v;
  const el = `<input class="in" type="number" step="any" data-bind="${path}" data-kind="${kind}" value="${Number.isFinite(+shown) ? shown : 0}" ${extra}>`;
  return kind === 'pct' ? `<span class="pw">${el}</span>` : el;
};
const sel = (path, v, opts) => `<select class="in" data-bind="${path}" data-kind="str">${opts.map(o => `<option${String(o) === String(v) ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
const yn = (path, v) => `<select class="in" data-bind="${path}" data-kind="bool">${['Oui', 'Non'].map(o => `<option${(o === 'Oui') === !!v ? ' selected' : ''}>${o}</option>`).join('')}</select>`;

VIEWS.hyp = () => {
  const nf = needFinance(); if (nf) return { html: `<h1 class="view">Hypothèses</h1>${nf}` };
  const H = S.H, B = H.base, M = S.M, pl = M.pl('Actuals', B), bs = M.bs('Actuals', B, 12), ca = pl.ca;
  const fulls = M.yearsOf('Actuals').filter(y => M.lastMonth('Actuals', y) === 12);
  const row = (key, lab, kind, ref, refTxt) => `<tr><td>${lab}</td><td class="num muted">${refTxt ?? (kind === 'pct' ? pct(ref) : fmt(ref))}</td>${H[key].map((v, i) => `<td>${inp(`H.${key}.${i}`, v, kind)}</td>`).join('')}<td class="no-print"><button class="btn small" data-act="fill" data-key="${key}" title="Recopier la 1re année sur toutes les années">→</button></td></tr>`;
  const sec = t => `<tr class="sec"><td colspan="${H.years.length + 3}">${t}</td></tr>`;
  const head = `<thead><tr><th>Hypothèse</th><th>Réel ${B}</th>${H.years.map(y => `<th>${y}</th>`).join('')}<th class="no-print"></th></tr></thead>`;
  const plP = M.pl('Actuals', B - 1);
  const body = sec('Activité') +
    row('gCA', "Croissance du chiffre d'affaires", 'pct', plP.ca ? ca / plP.ca - 1 : NaN) +
    row('g74', "Croissance des autres produits d'exploitation (74)", 'pct', plP.p74 ? pl.p74 / plP.p74 - 1 : NaN) +
    row('g76', 'Croissance des produits non récurrents (76)', 'pct', NaN, fmt(pl.p76) + ' €') +
    sec("Charges d'exploitation") +
    row('r60', 'Approvisionnements et marchandises (60), en % du CA', 'pct', -pl.c60 / ca) +
    row('r61', 'Services et biens divers (61), en % du CA', 'pct', -pl.c61 / ca) +
    row('r64', "Autres charges d'exploitation (64), en % du CA", 'pct', -pl.c64 / ca) +
    row('gPers', 'Croissance des frais de personnel (62)', 'pct', plP.c62 ? pl.c62 / plP.c62 - 1 : NaN) +
    row('c66', 'Charges non récurrentes (66), en €', 'num', -pl.c66) +
    sec('Financier et impôt') +
    row('p75', 'Produits financiers (75), en €', 'num', pl.p75) + row('c65', 'Charges financières (65), en €', 'num', -pl.c65) +
    row('tauxDecouvert', 'Intérêts sur trésorerie négative (taux annuel)', 'pct', NaN, '') +
    row('isoc', "Taux d'impôt des sociétés", 'pct', NaN, '') +
    sec('Fonds de roulement') +
    row('dso', 'Délai clients (DSO), jours de CA TVAC', 'num', NaN, NF1.format(bs.a40 / (ca * 1.21) * 365) + ' j') +
    row('dpo', 'Délai fournisseurs (DPO), jours de 60 + 61 TVAC', 'num', NaN, NF1.format(bs.p44 / ((-pl.c60 - pl.c61) * 1.21) * 365) + ' j') +
    row('moisSoc', 'Dettes fiscales et sociales (45), en mois de frais de personnel', 'num', NaN, NF2.format(bs.p45 / (-pl.c62 / 12))) +
    sec('Financement') +
    row('capital', 'Augmentation de capital (€)', 'num', 0) + row('dividendes', 'Dividendes versés (€)', 'num', 0) +
    row('emprunt', 'Nouvel emprunt (€)', 'num', 0) + row('rembours', 'Remboursement des dettes à plus d\'un an (€)', 'num', 0, bs.p17 > 0.5 ? fmt(bs.p17) + ' € dus' : '0');
  const capHead = `<thead><tr><th>Catégorie</th><th>Valeur nette fin ${B}</th><th>Durée (ans)</th>${H.years.map(y => `<th>${y}</th>`).join('')}<th class="no-print"></th></tr></thead>`;
  const capBody = IMMO_CATS.map(([k, l]) => `<tr><td>${l}</td>${td(bs[k])}<td>${inp(`H.duree.${k}`, H.duree[k])}</td>${H.capex[k].map((v, i) => `<td>${inp(`H.capex.${k}.${i}`, v)}</td>`).join('')}<td class="no-print"><button class="btn small" data-act="fillcap" data-key="${k}">→</button></td></tr>`).join('') +
    `<tr class="tot"><td>Total des investissements</td><td></td><td></td>${H.years.map((_, i) => td(IMMO_CATS.reduce((s, [k]) => s + (+H.capex[k][i] || 0), 0))).join('')}<td></td></tr>`;
  return { html: `<h1 class="view">Hypothèses de projection</h1>
    <p class="lead">Cellules jaunes = à saisir. Les valeurs par défaut viennent de l'exercice ${B}. Tout est enregistré dans ce navigateur et peut être exporté (bouton ci-dessous) pour être rechargé plus tard.</p>
    <div class="toolbar no-print"><label>Exercice de base<select id="h-base">${fulls.map(y => `<option${y === B ? ' selected' : ''}>${y}</option>`).join('')}</select></label>
      <label>Report des pertes fiscales${yn('H.reportPertes', H.reportPertes)}</label>
      <button class="btn" data-act="save-json">Exporter les hypothèses (.json)</button><button class="btn" data-act="load-json">Importer des hypothèses</button>
      <button class="btn" data-act="reset-hyp">Revenir aux valeurs par défaut</button></div>
    <div class="card"><div class="tw"><table class="t">${head}<tbody>${body}</tbody></table></div></div>
    <div class="card" style="margin-top:16px"><h2>Investissements (€) et durées d'amortissement</h2>
    <p class="note" style="margin-top:0">Par défaut : investissement de maintien égal aux amortissements de ${B} (${fmt(M.flow('Actuals', B, ['630'], 1, 12))} €), réparti selon la valeur nette des catégories. Les immobilisations existantes continuent de s'amortir au rythme de ${B} jusqu'à épuisement de leur valeur nette.</p>
    <div class="tw"><table class="t">${capHead}<tbody>${capBody}</tbody></table></div></div>` };
};

const PROJ_PL = [['ca', "Chiffre d'affaires"], ['p74', "Autres produits d'exploitation"], ['p76', 'Produits non récurrents'], ['prod', "Produits d'exploitation", 'sub'],
  ['c60', 'Approvisionnements et marchandises'], ['c61', 'Services et biens divers'], ['c62', 'Rémunérations et charges sociales'], ['c64', "Autres charges d'exploitation"], ['c66', 'Charges non récurrentes'],
  ['ebitda', 'EBITDA', 'sub'], ['c63', 'Amortissements'], ['ebit', "Résultat d'exploitation (EBIT)", 'tot'], ['fin', 'Résultat financier'], ['ebt', 'Résultat avant impôts', 'sub'],
  ['c67', 'Impôts sur le résultat'], ['rn', "Résultat de l'exercice", 'tot']];

VIEWS.proj = () => {
  const nf = needFinance(); if (nf) return { html: `<h1 class="view">Projection</h1>${nf}` };
  const P = S.proj, head = ['(€)'].concat(P.map(p => `${p.y}${p.actual ? ' (réel)' : ''}`));
  const pr = (k, l, cls) => `<tr class="${cls || ''}"><td>${l}</td>${P.map(p => td(p.pl[k])).join('')}</tr>`;
  const ratioRow = (l, f) => `<tr class="check"><td>${l}</td>${P.map(p => tdp(f(p))).join('')}</tr>`;
  const bad = P.filter(p => Math.abs(p.bs.ecart) > 1 || Math.abs(p.cf.ecart) > 1);
  const negT = P.find(p => !p.actual && p.bs.treso < 0);
  return { html: `<h1 class="view">Projection</h1><p class="lead">Compte de résultats, bilan et flux annuels à partir des hypothèses. Base : réel ${S.H.base}.</p>
    ${bad.length ? '<div class="alert bad">Le bilan projeté ne s\'équilibre pas : vérifiez les hypothèses.</div>' : ''}
    ${negT ? `<div class="alert warn">La trésorerie devient négative en ${negT.y} (${fmtK(negT.bs.treso)}) : un financement sera nécessaire (onglet Hypothèses › Financement).</div>` : ''}
    <div class="card"><h2>Chiffre d'affaires, EBITDA, résultat et trésorerie</h2><div class="chart"><canvas id="c-pj"></canvas></div></div>
    <div class="card" style="margin-top:16px"><h2>Compte de résultats</h2>${tbl(head, PROJ_PL.map(([k, l, c]) => pr(k, l, c)).join('') + ratioRow('Marge EBITDA', p => p.pl.ebitda / p.pl.ca) + ratioRow('Croissance du CA', p => { const i = P.indexOf(p); return i ? p.pl.ca / P[i - 1].pl.ca - 1 : NaN; }))}</div>
    <div class="card" style="margin-top:16px"><h2>Bilan (fin d'exercice)</h2>${tbl(head, bsRows(k => P.map(p => p.bs[k]), { check: true, hideZero: true }))}</div>
    <div class="card" style="margin-top:16px"><h2>Tableau des flux</h2>${tbl(head, cfRows(k => P.map(p => p.cf[k]), true))}</div>`,
  after() {
    const C = palette();
    mkChart('c-pj', { data: { labels: P.map(p => p.y + (p.actual ? ' (réel)' : '')), datasets: [
      { type: 'bar', label: "Chiffre d'affaires", data: P.map(p => p.pl.ca), backgroundColor: C[5], order: 3 },
      { type: 'bar', label: 'EBITDA', data: P.map(p => p.pl.ebitda), backgroundColor: C[0], order: 2 },
      { type: 'bar', label: 'Résultat', data: P.map(p => p.pl.rn), backgroundColor: C[3], order: 2 },
      { type: 'line', label: 'Trésorerie', data: P.map(p => p.bs.treso), borderColor: C[1], backgroundColor: C[1], order: 1 }] }, options: { scales: { y: moneyAxis } } });
  } };
};

VIEWS.retr = () => {
  const nf = needFinance(); if (nf) return { html: `<h1 class="view">Retraitements</h1>${nf}` };
  const R = S.R7, Y = R.Y;
  const rowsA = R.rows.map((r, i) => `<tr><td>${r.free ? `<input class="in txt" data-bind="R.rows.${i}.l" data-kind="str" value="${esc(r.l)}">` : esc(r.l)}</td><td class="l muted">${r.src}</td>
    ${r.free ? `<td>${inp(`R.rows.${i}.n1`, r.n1)}</td><td>${inp(`R.rows.${i}.n`, r.n)}</td>` : td(r.a[0]) + td(r.a[1])}
    <td>${yn(`R.rows.${i}.ret`, r.ret)}</td><td>${yn(`R.rows.${i}.rec`, r.rec)}</td><td>${r.norm !== undefined ? inp(`R.rows.${i}.norm`, r.norm) : '<span class="muted">—</span>'}</td>
    ${td(r.adj[0])}${td(r.adj[1])}<td class="l muted" style="min-width:220px">${esc(r.help || 'Montant tel qu\'au compte de résultats (charge en négatif).')}</td></tr>`).join('');
  const A = `<tr class="sub"><td>EBITDA publié (non récurrents compris)</td><td class="l muted">P&L</td>${td(R.ebitdaPub[0])}${td(R.ebitdaPub[1])}<td colspan="3"></td><td></td><td></td><td></td></tr>${rowsA}
    <tr class="sub"><td>Total des retraitements</td><td></td><td></td><td></td><td colspan="3"></td>${td(R.totAdj[0])}${td(R.totAdj[1])}<td></td></tr>
    <tr class="tot"><td>EBITDA normatif</td><td></td>${td(R.ebitdaNorm[0])}${td(R.ebitdaNorm[1])}<td colspan="6"></td></tr>
    <tr class="check"><td>Marge EBITDA normative (sur CA code 70)</td><td></td>${tdp(R.marge[0])}${tdp(R.marge[1])}<td colspan="6"></td></tr>`;
  const B = R.bil.map((r, i) => `<tr><td>${esc(r.l)}</td><td class="l muted">${r.src}</td>${r.e === null ? '<td class="num muted">—</td>' : td(r.e)}<td>${yn(`R.bilan.${i}.ret`, r.ret)}</td><td class="l">${r.nat}</td>
    <td>${r.vm !== undefined ? inp(`R.bilan.${i}.vm`, r.vm) : '<span class="muted">—</span>'}</td>${td(r.j)}</tr>`).join('');
  return { html: `<h1 class="view">Retraitements de valorisation</h1>
    <p class="lead">Isolez les éléments à retirer ou à normaliser avant de valoriser. « Retraiter = Oui » corrige l'EBITDA historique ; si l'élément est aussi « Récurrent », la correction est appliquée à chaque année du DCF. Les non-récurrents retraités (76, 66) sont également retirés des années projetées.</p>
    <div class="card"><h2>A. Compte de résultats — de l'EBITDA publié à l'EBITDA normatif</h2>
    ${tbl(['Élément', 'Comptes', `Montant ${Y[0]}`, `Montant ${Y[1]}`, 'Retraiter ?', 'Récurrent (DCF) ?', 'Coût normatif annuel', `Ajustement ${Y[0]}`, `Ajustement ${Y[1]}`, 'Commentaire'], A)}
    <div class="toolbar" style="margin-top:12px"><label>EBITDA de référence pour la valorisation${sel('R.choix', S.R.choix, ['Dernier exercice', 'Moyenne 2 exercices'])}</label>
    <div class="card kpi" style="padding:8px 14px"><div class="lab">EBITDA retenu</div><div class="val">${fmtK(R.ebitdaRef)}</div></div>
    <div class="card kpi" style="padding:8px 14px"><div class="lab">Retraitement récurrent ajouté au DCF</div><div class="val">${fmtK(R.recurrent)}</div></div>
    <div class="card kpi" style="padding:8px 14px"><div class="lab">Résultat net normatif ${Y[1]}</div><div class="val${R.rnNorm[1] < 0 ? ' neg' : ''}">${fmtK(R.rnNorm[1])}</div></div></div></div>
    <div class="card" style="margin-top:16px"><h2>B. Bilan — de la valeur d'entreprise à la valeur des fonds propres</h2>
    ${tbl(['Élément', 'Comptes', `Solde fin ${Y[1]}`, 'Retenir ?', 'Nature', 'Valeur de marché (saisie)', 'Effet sur la dette nette'], B +
      `<tr class="tot"><td>Dette nette ajustée</td><td colspan="5"></td>${td(R.detteNette)}</tr><tr class="check"><td>Pour comparaison : dette nette comptable</td><td colspan="5"></td>${td(R.detteComptable)}</tr>`)}
    <p class="note">Dettes financières : un solde débiteur (dette négative) n'est pas compté. Trésorerie et actifs hors exploitation diminuent la dette nette.</p></div>` };
};

VIEWS.val = () => {

  const meth = X.meth.map(m => `<tr><td>${m.l}</td>${td(m.v[0])}${td(m.v[1])}${td(m.v[2])}<td>${inp(`V.poids.${m.k}`, m.poids, 'pct')}</td>${tdp(m.w)}${td(m.contrib)}
    <td><select class="in" data-bind="V.force.${m.k}" data-kind="str">${['', 'Oui', 'Non'].map(o => `<option value="${o}"${V.force[m.k] === o ? ' selected' : ''}>${o || 'Auto'}</option>`).join('')}</select></td><td class="l"><span class="badge ${m.w && m.v[1] > 0 ? 'b-ok' : m.w ? 'b-warn' : 'b-info'}">${m.statut}</span></td></tr>`).join('');

  const sensBody = X.sens.waccs.map((w, i) => `<tr><td>WACC ${pct(w)}</td>${X.sens.grid[i].map(v => td(v, Math.abs(w - X.wacc) < 1e-9 ? 'sub' : '')).join('')}</tr>`).join('');
  return { html: `<h1 class="view">Valorisation</h1>
    <p class="lead">Valeur des fonds propres à fin ${B}, sur base des retraitements et de la projection. Cellules jaunes = hypothèses de marché à saisir.</p>

      <div class="pill-row"><span class="badge b-info">Fourchette ${fmtK(X.fourchette[0])} – ${fmtK(X.fourchette[1])}</span>
      ${X.plancherApplique ? '<span class="badge b-warn">Plancher appliqué : actif net corrigé</span>' : ''}
      <span class="badge b-info">Valeur pondérée ${fmtK(X.pond)} − décote d'illiquidité ${pct(V.dlom, 0)}</span></div>
      <div class="chart" style="margin-top:12px"><canvas id="c-ff"></canvas></div></div>
    <div class="grid g2" style="margin-top:16px">
      <div class="card"><h2>1. Agrégats de référence (${B})</h2>${tbl(['Agrégat', `Base ${B}`], [["Chiffre d'affaires (70)", ag.ca], ['EBITDA normatif', ag.ebitda], ['EBIT normatif', ag.ebit], ['Résultat net normatif', ag.rn],
        ['Fonds propres comptables', ag.cp], ['Dettes financières', ag.dettesFin], ['Trésorerie et placements', ag.treso], ['Dette nette ajustée (Retraitements)', ag.dn]].map(([l, v]) => `<tr><td>${l}</td>${td(v)}</tr>`).join(''))}</div>
      <div class="card"><h2>2. Coût du capital (WACC, build-up PME)</h2>${tbl(['Paramètre', 'Valeur'], [
        ['Taux sans risque (OLO 10 ans)', inp('V.rf', V.rf, 'pct')], ['Prime de risque du marché actions', inp('V.mrp', V.mrp, 'pct')], ['Prime de taille (PME)', inp('V.size', V.size, 'pct')],
        ['Prime spécifique (dépendance clients, dirigeant…)', inp('V.spec', V.spec, 'pct')], ['<b>Coût des fonds propres</b>', pct(X.ke)], ['Coût de la dette avant impôt', inp('V.kd', V.kd, 'pct')],
        ["Taux d'impôt (1re année projetée)", pct(X.t)], ['Part de la dette dans le financement', inp('V.dShare', V.dShare, 'pct')], ['<b>WACC</b>', `<b>${pct(X.wacc, 2)}</b>`],
        ["Croissance à l'infini (g)", inp('V.g', V.g, 'pct')], ['Valeur terminale normalisée (investissements = amortissements)', yn('V.tvNorm', V.tvNorm)]].map(([l, v]) => `<tr><td>${l}</td><td class="num">${v}</td></tr>`).join(''))}
        ${D.warn ? '<div class="alert warn" style="margin-top:10px">Le WACC doit être supérieur à g : la valeur terminale est neutralisée.</div>' : ''}</div></div>

        dr('+ Dotations aux amortissements', 'amort') + dr('− Investissements', 'capex') + dr('± Variation du BFR', 'bfr') + dr('Flux de trésorerie disponible (FCFF)', 'fcf', 'tot') +
        `<tr class="check"><td>Facteur d'actualisation</td>${D.rows.map(r => `<td class="num">${NF2.format(r.df)}</td>`).join('')}<td></td><td></td></tr><tr><td>FCFF actualisé</td>${D.rows.map(r => td(r.pv)).join('')}<td></td>${td(D.tvPv)}</tr>`)}
      <div class="kpis" style="margin-top:12px">${[['Somme des FCFF actualisés', D.pv], ['Valeur terminale actualisée', D.tvPv], ["Valeur d'entreprise", D.ev], ['− Dette nette', -ag.dn], ['Fonds propres — DCF', D.eq]].map(([l, v]) => `<div class="card kpi"><div class="lab">${l}</div><div class="val${v < 0 ? ' neg' : ''}">${fmtK(v)}</div></div>`).join('')}

        ['± Autres corrections (actifs non valorisés, passifs latents)', inp('V.anc.autres', V.anc.autres)], ["− Impôt latent sur les plus-values", fmt(-V.anc.pv * X.t)], ['<b>Actif net corrigé</b>', `<b>${fmt(X.meth[4].v[1])}</b>`],
        ["Fourchette appliquée à l'ANC (±)", inp('V.anc.fourchette', V.anc.fourchette, 'pct')]].map(([l, v]) => `<tr><td>${l}</td><td class="num">${v}</td></tr>`).join(''))}</div></div>
    <div class="card" style="margin-top:16px"><h2>5. Synthèse</h2>
      ${tbl(['Méthode', 'Basse', 'Centrale', 'Haute', 'Pondération', 'Pondération retenue', 'Contribution', 'Forcer', 'Statut'], meth +
        `<tr class="sub"><td>Valeur pondérée</td><td></td><td></td><td></td><td></td><td></td>${td(X.pond)}<td></td><td></td></tr>
        <tr><td>Décote d'illiquidité (DLOM)</td><td colspan="3"></td><td>${inp('V.dlom', V.dlom, 'pct')}</td><td></td>${td(-X.dlom)}<td></td><td></td></tr>

        <tr class="tot"><td>Valeur des fonds propres retenue</td><td colspan="5"></td>${td(X.retenue)}<td></td><td></td></tr>`)}

/* ------------------------------------------------------------ events -- */
function setPath(path, raw, kind) {
  const parts = path.split('.'); const root = parts.shift();
  let o = S[root]; while (parts.length > 1) o = o[parts.shift()];
  const k = parts[0];
  let v = raw;
  if (kind === 'num') v = parseFloat(String(raw).replace(',', '.')) || 0;
  else if (kind === 'pct') v = (parseFloat(String(raw).replace(',', '.')) || 0) / 100;
  else if (kind === 'bool') v = raw === 'Oui';
  o[k] = v;
}

document.addEventListener('change', e => {
  const t = e.target;
  if (RAWS && (t.classList.contains('mp-map') || /^mp-/.test(t.id))) {
    const P = RAWS.plan;
    if (t.classList.contains('mp-map')) { const v = +t.value; if (v < 0) delete P.map[t.dataset.f]; else P.map[t.dataset.f] = v; }
    else if (t.id === 'mp-sc') P.scenario = t.value;
    else if (t.id === 'mp-soc') P.societe = t.value;
    else if (t.id === 'mp-dc') P.decimalComma = t.value === '1';
    else if (t.id === 'mp-do') P.dateOrder = t.value;
    else if (t.id === 'mp-inv') P.invert = t.value === '1';
    else if (t.id === 'mp-mem') P.remember = t.value === '1';
    showMapping(); return;
  }
  if (t.id === 'mg-sc' && pendingAppend) { const pa = pendingAppend; proposeMerge(retag(pa.lines, t.value), pa.name, pa.note); return; }
  if (t.dataset.bind) {
    const sx = window.scrollX, sy = window.scrollY;
    setPath(t.dataset.bind, t.value, t.dataset.kind); recompute(); autosave(); render(); window.scrollTo(sx, sy); return;
  }
  const M = S.M;
  switch (t.id) {
    case 'f-soc': M.setCompany(t.value); fixYear(); initFinance(restore()); break;
    case 'f-sc': S.sc = t.value; fixYear(); break;
    case 'f-y': S.y = +t.value; S.m = Math.min(S.m, M.lastMonth(S.sc, S.y) || 12); break;
    case 'f-m': S.m = +t.value; break;
    case 'f-jr': M.setOpening(t.value); recompute(); break;
    case 'f-cmp': S.cmp = t.value; break;
    case 'h-base': S.H = defaultHyp(M, +t.value); recompute(); autosave(); break;
    case 'gl-acc': S.gl.acc = t.value.trim(); S.gl.page = 0; break;
    case 'gl-txt': S.gl.txt = t.value; S.gl.page = 0; break;
    case 'gl-jr': S.gl.jr = t.value; S.gl.page = 0; break;
    case 'gl-m1': S.gl.m1 = +t.value; S.gl.page = 0; break;
    case 'gl-m2': S.gl.m2 = +t.value; S.gl.page = 0; break;
    case 'file-in': if (t.files[0]) loadFile(t.files[0]); return;
    case 'append-in': if (t.files[0]) appendFile(t.files[0]); return;
    case 'f-mem': toggleMemory(t.checked); return;
    case 'json-in': if (t.files[0]) importJson(t.files[0]); return;
    default: return;
  }
  render();
});

document.addEventListener('click', e => {
  const b = e.target.closest('[data-tab],[data-act],[data-exp]');
  if (!b) return;
  if (b.dataset.tab) { S.tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (b.dataset.exp) { const k = b.dataset.exp; S.expanded.has(k) ? S.expanded.delete(k) : S.expanded.add(k); render(); return; }
  const a = b.dataset.act, H = S.H;
  switch (a) {
    case 'theme': {
      const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark'; rerender(); break;
    }
    case 'print': window.print(); break;
    case 'reload': $('#file-in').click(); break;
    case 'pick': $('#file-in').click(); break;
    case 'fill': H[b.dataset.key] = H[b.dataset.key].map(() => H[b.dataset.key][0]); recompute(); autosave(); render(); break;
    case 'fillcap': H.capex[b.dataset.key] = H.capex[b.dataset.key].map(() => H.capex[b.dataset.key][0]); recompute(); autosave(); render(); break;
    case 'reset-hyp': if (confirmReset()) { S.H = defaultHyp(S.M, H.base); recompute(); autosave(); render(); } break;
    case 'save-json': download(`hypotheses_${(S.M.soc || S.M.source).replace(/[^\w-]+/g, '_')}.json`, JSON.stringify({ version: 1, source: S.M.source, H: S.H, R: S.R, V: S.V }, null, 2)); break;
    case 'load-json': $('#json-in').click(); break;
    case 'gl-prev': S.gl.page = Math.max(0, S.gl.page - 1); render(); break;
    case 'gl-next': S.gl.page++; render(); break;
    case 'gl-csv': exportGl(); break;
    case 'dossier': openDossierDialog(); break;
    case 'append': $('#append-in').click(); break;
    case 'export-xlsx': exportXlsx(); break;
    case 'dlg-append': applyAppend(); break;
    case 'mp-ok': importRaw(false); break;
    case 'mp-cancel': if (RAWS.mode === 'load' && !S.M) landing(); else render(); break;
    case 'mp-edit': showMapping(); break;
    case 'fmt-clear': try { localStorage.removeItem('altesia-formats-colonnes'); } catch (err) { /* */ } landing(); break;
    case 'rebase': S.H = defaultHyp(S.M, +b.dataset.y); recompute(); autosave(); S.flash = { cls: 'ok', html: `Projection recalculée à partir de l'exercice ${b.dataset.y}.` }; render(); break;
    case 'dlg-close': closeDialog(); break;
    case 'dlg-save': saveDossier(); break;
    case 'dlg-open': openEncrypted(); break;
    case 'mem-open': openMemory(b.dataset.id); break;
    case 'mem-del': forgetMemory(b.dataset.id); break;
  }
});
function confirmReset() { return window.confirm('Remplacer toutes les hypothèses par les valeurs par défaut ?'); }

function exportGl() {
  const L = S.M.L, P = L.pools, n2 = v => String(Math.round(v * 100) / 100).replace('.', ',');
  const q = s => `"${String(s).replace(/"/g, '""')}"`;
  const lines = ['Annee;Mois;Journal;Piece;Compte;Tiers;Libelle;Debit;Credit;Montant'];
  for (const i of S.glIdx || []) lines.push([L.y[i], L.m[i], q(P.jr.list[L.jr[i]]), q(P.pc.list[L.pc[i]]), q(P.acc.list[L.acc[i]]), q(P.tiers.list[L.tiers[i]]), q(P.lib.list[L.lib[i]]), n2(L.deb[i]), n2(L.cred[i]), n2(L.mt[i])].join(';'));
  download(`grand_livre_${S.y}.csv`, '﻿' + lines.join('\r\n'), 'text/csv');
}

async function importJson(file) {
  try {
    const j = JSON.parse(await file.text());
    if (!j.H) throw new Error('Fichier d\'hypothèses invalide.');
    S.H = j.H; S.R = j.R || defaultRetr(); S.V = Object.assign(defaultVal(), j.V || {});
    recompute(); autosave(); render();
  } catch (e) { alert(e.message); }
  $('#json-in').value = '';
}

function fixYear() {
  const ys = S.M.yearsOf(S.sc);
  if (!ys.includes(S.y)) {
    // dernier exercice suffisamment rempli (évite un exercice qui ne contient que quelques règlements tardifs)
    const ok = ys.filter(y => S.M.monthsOf(S.sc, y).length >= 3);
    S.y = (ok.length ? ok : ys)[(ok.length ? ok : ys).length - 1];
  }
  S.m = S.M.lastMonth(S.sc, S.y) || 12;
}

/* -------------------------------------------------------------- load -- */
function progressView(title) {
  $('#view').innerHTML = `<div class="landing"><div class="card" style="text-align:center;padding:40px"><b>${esc(title)}</b>
    <div class="muted" id="pg-txt">Lecture directement dans votre navigateur.</div><div class="progress"><div id="pg"></div></div></div></div>`;
}

/** Installe un jeu de données (fichier lu, dossier mémorisé ou fichier dossier). */
function setModel(parsed, meta = {}) {
  if (!parsed.lines.n) throw new Error('Aucune écriture trouvée dans ce fichier.');
  S.M = new Model(parsed);
  S.app = 'gl'; if (typeof setBrand === 'function') setBrand('Analyse du grand livre & valorisation');
  if (meta.soc) S.M.setCompany(meta.soc);
  if (meta.opening !== undefined && meta.opening !== S.M.opening) S.M.setOpening(meta.opening);
  S.aggregated = !!meta.aggregated; S.memId = meta.memId || null;
  S.sc = S.M.hasScenario('Actuals') ? 'Actuals' : S.M.scenarios.find(s => S.M.hasScenario(s));
  S.y = null; fixYear(); S.gl = { acc: '', txt: '', jr: '', m1: 1, m2: 12, page: 0 };
  initFinance(meta.H ? { H: meta.H, R: meta.R, V: meta.V } : restore());
  document.body.classList.add('loaded');
  render();
}

async function loadFile(file) {
  $('#file-in').value = '';
  if (/\.afdossier$/i.test(file.name)) return loadDossierFile(file);
  progressView(`Lecture de ${file.name}…`);
  try {
    const parsed = await readGlFile(file, (p, n) => { const el = $('#pg'); if (el) el.style.width = Math.round(p * 100) + '%'; const tx = $('#pg-txt'); if (tx) tx.textContent = `${NF0.format(n)} lignes lues…`; });
    await installParsed(parsed);
  } catch (e) {
    if (e.code === 'NOT_NORMALIZED') return startRaw(file, 'load');
    console.error(e); landing(`<div class="alert bad">${esc(e.message)}</div>`);
  }
}
async function installParsed(parsed, meta = {}) {
  const prev = (await memList()).find(r => r.id === parsed.source);
  setModel(parsed, { memId: null, ...meta });
  // Nouveau fichier d'un dossier déjà mémorisé : la mémoire est mise à jour automatiquement.
  if (prev) { await rememberCurrent(); render(); }
}

/* ---- GL brut : rattachement des colonnes (détection automatique + confirmation) ---- */
let RAWS = null;   // { info, plan, mode }
async function startRaw(file, mode) {
  try {
    if (mode === 'load') progressView(`Analyse des colonnes de ${file.name}…`);
    const info = await inspectRaw(file);
    const prof = profileFor(info);
    const base = mode === 'append' && S.M ? (S.M.soc || S.M.L.pools.soc.list.find(Boolean) || '') : file.name.replace(/\.[^.]+$/, '');
    const plan = prof
      ? { map: prof.map, decimalComma: prof.decimalComma, dateOrder: prof.dateOrder, invert: prof.invert, scenario: prof.scenario, societe: base, remember: true }
      : { map: { ...info.auto }, decimalComma: info.decimalComma, dateOrder: info.dateOrder, invert: false, scenario: 'Actuals', societe: base, remember: true };
    RAWS = { info, plan, mode, known: !!prof };
    if (prof) return importRaw(true);
    closeDialog(); showMapping();
  } catch (e) {
    console.error(e);
    if (mode === 'load') landing(`<div class="alert bad">${esc(e.message)}</div>`);
    else showDialog(`<h2>Ajouter des mois</h2><div class="alert bad">${esc(e.message)}</div><div class="toolbar" style="justify-content:flex-end"><button class="btn" data-act="dlg-close">Fermer</button></div>`);
  }
}

function showMapping() {
  const { info, plan, mode } = RAWS;
  S.charts.forEach(c => c.destroy()); S.charts = [];
  const opt = (sel, v, l) => `<option value="${v}"${sel ? ' selected' : ''}>${esc(l)}</option>`;

  const auto = f => (info.auto[f] !== undefined && plan.map[f] === info.auto[f] ? '<span class="badge b-ok">détecté</span>' : plan.map[f] !== undefined && plan.map[f] >= 0 ? '<span class="badge b-info">choisi</span>' : '');
  const pb = validateRawMap(plan.map);
  // aperçu des lignes telles qu'elles seront lues
  const T = new Lines();
  const prev = info.sample.slice(0, 12).map(r => { const ok = rawRowToLine(T, r, plan); return { r, ok, i: T.n - 1 }; });
  let readable = 0; const T2 = new Lines(); info.sample.forEach(r => { if (rawRowToLine(T2, r, plan)) readable++; });
  let d2 = 0, c2 = 0; for (let i = 0; i < T2.n; i++) { d2 += T2.deb[i]; c2 += T2.cred[i]; }

  const prevRows = prev.map(({ ok, i }) => ok

    : `<tr class="check"><td colspan="8">Ligne ignorée (pas de compte, de date ou de montant lisible)</td></tr>`).join('');
  $('#filters').innerHTML = ''; $('#tabs').innerHTML = '';
  $('#view').innerHTML = `<h1 class="view">Rattachement des colonnes</h1>
    <p class="lead">${esc(info.file.name)}${info.sheet ? ` › ${esc(info.sheet)}` : ''} ${info.headerRow ? ` — ${info.headerRow} ligne${info.headerRow > 1 ? 's' : ''} de titre ignorée${info.headerRow > 1 ? 's' : ''}` : ''}. Les colonnes ont été reconnues automatiquement : vérifiez, corrigez si besoin, puis confirmez. ${plan.remember ? "Le choix sera mémorisé sur cet ordinateur pour ce format : les prochains fichiers (par exemple d'autres mois) seront reconnus sans cette étape." : ''}</p>
    ${pb.length ? `<div class="alert bad">${pb.map(esc).join('<br>')}</div>` : `<div class="alert ok">Rattachement complet — ${readable} lignes lisibles sur les ${info.sample.length} premières${Math.abs(d2 - c2) < 1 ? ', débit = crédit sur l\'échantillon' : ''}.</div>`}
    <div class="grid g2">
      <div class="card"><h2>Colonnes</h2><div class="tw"><table class="t"><thead><tr><th class="l">Champ</th><th class="l">Colonne du fichier</th><th></th><th class="l">Aide</th></tr></thead><tbody>
        ${RAW_FIELDS.map(([f, l, h]) => `<tr><td>${l}</td><td style="min-width:200px">${selCol(f)}</td><td class="c">${auto(f)}</td><td class="l muted">${h}</td></tr>`).join('')}
      </tbody></table></div></div>
      <div class="card"><h2>Options</h2><div class="tw"><table class="t"><tbody>
        <tr><td>Type de données</td><td><select class="in" id="mp-sc">${[['Actuals', 'Réel'], ['Budget', 'Budget'], ['Forecast', 'Forecast']].map(([v, l]) => opt(plan.scenario === v, v, l)).join('')}</select></td></tr>
        <tr><td>Société</td><td><input class="in txt" id="mp-soc" value="${esc(plan.societe)}"${mode === 'append' ? ' disabled' : ''}></td></tr>
        <tr><td>Séparateur décimal</td><td><select class="in" id="mp-dc">${opt(plan.decimalComma, 1, 'Virgule (1.234,56)')}${opt(!plan.decimalComma, 0, 'Point (1,234.56)')}</select></td></tr>
        <tr><td>Format des dates</td><td><select class="in" id="mp-do">${opt(plan.dateOrder === 'dmy', 'dmy', 'Jour/mois/année')}${opt(plan.dateOrder === 'mdy', 'mdy', 'Mois/jour/année')}</select></td></tr>
        <tr><td>Montant signé : inverser le signe</td><td><select class="in" id="mp-inv">${opt(!plan.invert, 0, 'Non (débit positif)')}${opt(plan.invert, 1, 'Oui (crédit positif)')}</select></td></tr>
        <tr><td>Mémoriser ce format sur cet ordinateur</td><td><select class="in" id="mp-mem">${opt(plan.remember, 1, 'Oui')}${opt(!plan.remember, 0, 'Non')}</select></td></tr>
      </tbody></table></div>

      ${tbl(['Période', 'Compte', 'Journal', 'Tiers', 'Libellé', 'Débit', 'Crédit', 'Rubrique BNB'], prevRows)}</div>`;

async function importRaw(auto) {
  const { info, plan, mode } = RAWS;
  if (validateRawMap(plan.map).length) return showMapping();
  if (mode === 'load') progressView(`Import de ${info.file.name}…`);
  try {
    const parsed = await readRaw(info, plan, (p, n) => { const el = $('#pg'); if (el) el.style.width = Math.round(p * 100) + '%'; const tx = $('#pg-txt'); if (tx) tx.textContent = `${NF0.format(n)} lignes lues…`; });
    if (!parsed.lines.n) throw new Error("Aucune écriture lisible avec ce rattachement.");
    if (plan.remember) saveProfile(info, plan);
    const note = `${auto ? 'Format reconnu : colonnes rattachées automatiquement. ' : 'Colonnes rattachées. '}${NF0.format(parsed.lines.n)} écritures importées${parsed.skipped ? `, ${NF0.format(parsed.skipped)} lignes ignorées (sans compte, date ou montant)` : ''}${Math.abs(parsed.balance) > 1 ? ` — attention : débit − crédit = ${fmt(parsed.balance)} €` : ' — débit = crédit'}.`;
    const link = ' <button class="btn small" data-act="mp-edit">Vérifier les colonnes</button>';
    if (mode === 'append') return proposeMerge(parsed.lines, info.file.name, note);
    await installParsed(parsed);
    S.flash = { cls: Math.abs(parsed.balance) > 1 ? 'warn' : 'ok', html: note + link }; render();
  } catch (e) {
    console.error(e);
    if (mode === 'load') { showMapping(); $('#view').insertAdjacentHTML('afterbegin', `<div class="alert bad">${esc(e.message)}</div>`); }
    else showDialog(`<h2>Ajouter des mois</h2><div class="alert bad">${esc(e.message)}</div><div class="toolbar" style="justify-content:flex-end"><button class="btn" data-act="dlg-close">Fermer</button></div>`);
  }
}

/* ---- Compléter le dossier avec un ou plusieurs mois ---- */
let pendingAppend = null;
const perLabel = k => { const [sc, y, m] = k.split('|'); return `${MOIS_C[+m]} ${y}${sc !== 'Actuals' ? ` (${sc})` : ''}`; };
async function appendFile(file) {
  $('#append-in').value = '';
  showDialog(`<h2>Ajouter des mois au dossier</h2><p class="note" style="margin-top:0">Lecture de ${esc(file.name)}…</p><div class="progress"><div id="pg"></div></div>`);
  try {
    let parsed;
    try { parsed = await readGlFile(file, p => { const el = $('#pg'); if (el) el.style.width = Math.round(p * 100) + '%'; }); }
    catch (e) { if (e.code === 'NOT_NORMALIZED') return startRaw(file, 'append'); throw e; }
    if (!parsed.lines.n) throw new Error('Aucune écriture trouvée dans ce fichier.');
    proposeMerge(parsed.lines, file.name, '');
  } catch (e) {
    showDialog(`<h2>Ajouter des mois au dossier</h2><div class="alert bad">${esc(e.message)}</div><div class="toolbar" style="justify-content:flex-end"><button class="btn" data-act="dlg-close">Fermer</button></div>`);
  }
}
function retag(L, sc) {
  const P = new Pool(); P.id(sc);
  L.pools.sc = P; L.sc = new Int32Array(L.n);
  return L;
}
function proposeMerge(lines, name, note) {
  try {
    if (RAWS && RAWS.mode === 'append') { RAWS = null; render(); }
    const single = lines.pools.sc.list.length === 1;
    const res = mergeLines(S.M.L, lines);
    pendingAppend = { res, name, lines, note, single };
    const cur = lines.pools.sc.list[0];
    const scSel = single ? `<label class="fld">Ces écritures sont du<select class="in" id="mg-sc">${[['Actuals', 'Réel'], ['Budget', 'Budget'], ['Forecast', 'Forecast']].map(([v, l]) => `<option value="${v}"${v === cur ? ' selected' : ''}>${l}</option>`).join('')}</select></label>` : '';
    const list = arr => arr.sort((a, b) => { const [, ya, ma] = a.split('|'), [, yb, mb] = b.split('|'); return ya - yb || ma - mb; }).map(perLabel).join(', ');
    showDialog(`<h2>Ajouter des mois au dossier</h2>
      <p class="note" style="margin-top:0">${esc(name)} : ${NF0.format(res.addedLines)} écritures.${note ? ' ' + esc(note) : ''}</p>
      ${res.added.length ? `<div class="alert ok"><b>Mois ajoutés :</b> ${list(res.added)}</div>` : ''}
      ${res.replaced.length ? `<div class="alert warn"><b>Mois déjà présents, remplacés par ce fichier :</b> ${list(res.replaced)}<br>(${NF0.format(res.dropped)} anciennes écritures retirées — pas de double comptage)</div>` : ''}
      ${scSel}
      <p class="note">Les hypothèses, retraitements et paramètres de valorisation sont conservés.${S.memId ? ' Le dossier mémorisé sur ce PC sera mis à jour.' : ''}</p>
      <div class="toolbar" style="justify-content:flex-end;margin:14px 0 0"><button class="btn" data-act="dlg-close">Annuler</button><button class="btn primary" data-act="dlg-append">Ajouter au dossier</button></div>`);
  } catch (e) {
    showDialog(`<h2>Ajouter des mois au dossier</h2><div class="alert bad">${esc(e.message)}</div><div class="toolbar" style="justify-content:flex-end"><button class="btn" data-act="dlg-close">Fermer</button></div>`);
  }
}
async function applyAppend() {

/* ==========================================================================
   aged.js — Onglet « Balance âgée » (Analyse du grand livre)
   Deux sources :
   1. calculée depuis le grand livre : pour chaque client (40) / fournisseur (44),
      les règlements sont imputés aux factures les plus anciennes (FIFO) ;
      l'échéance = date de la pièce + délai de paiement paramétrable ;
   2. importée : balance âgée du logiciel comptable (Excel / CSV), rapprochée
      du solde du grand livre.
   ========================================================================== */
'use strict';

const AG_BUCKETS = ['Non échu', '1-30 j', '31-60 j', '61-90 j', '91-180 j', '> 180 j'];
const agBucket = days => (days <= 0 ? 0 : days <= 30 ? 1 : days <= 60 ? 2 : days <= 90 ? 3 : days <= 180 ? 4 : 5);
S.ag = { kind: 'C', src: 'gl', termC: 30, termF: 30, imp: null, q: '' };
const serialToDate = s => new Date(Date.UTC(1899, 11, 30) + s * 864e5);
const dateToSerial = (y, m, d) => Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5);
const fmtDate = s => (s ? serialToDate(s).toLocaleDateString('fr-BE', { timeZone: 'UTC' }) : '');
const agKey = () => 'altesia-balance-agee:' + (S.M ? S.M.source : '');

/** Postes ouverts à la date de référence, à partir du grand livre (FIFO par tiers). */
function agFromGl(M, kind, refSerial, term) {
  const L = M.L, P = L.pools, opId = M.opening ? P.jr.map.get(M.opening) : -1;
  const scId = P.sc.map.get('Actuals'), socId = M.soc ? P.soc.map.get(M.soc) : -1;
  const pref = kind === 'C' ? '40' : '44', excl = kind === 'C' ? '409' : '449';
  const accOk = P.acc.list.map(a => a.startsWith(pref) && !a.startsWith(excl));
  const refY = serialToDate(refSerial).getUTCFullYear();
  const per = new Map();       // tiers -> mouvements
  for (let i = 0; i < L.n; i++) {
    if (L.sc[i] !== scId || !accOk[L.acc[i]] || (socId >= 0 && L.soc[i] !== socId)) continue;
    const y = L.y[i]; if (y !== refY) continue;                 // l'exercice de référence contient l'ouverture
    const ds = L.date[i] > 20000 ? L.date[i] : dateToSerial(y, L.m[i], L.jr[i] === opId ? 1 : 15);
    if (ds > refSerial) continue;
    const t = P.tiers.list[L.tiers[i]] || '(sans tiers)';
    const v = kind === 'C' ? L.mt[i] : -L.mt[i];            // + = facture, − = règlement / note de crédit
    if (!per.has(t)) per.set(t, []);
    per.get(t).push({ ds, v, pc: P.pc.list[L.pc[i]] || '', open: L.jr[i] === opId });
  }
  const items = [];
  for (const [t, mv] of per) {
    mv.sort((a, b) => a.ds - b.ds);
    const inv = mv.filter(x => x.v > 0).map(x => ({ ...x, rest: x.v }));
    // 1) règlement du montant exact d'une facture (cas le plus fréquent) ; 2) le reste sur les plus anciennes (FIFO)
    let pay = 0;
    for (const p of mv.filter(x => x.v < 0)) {
      const hit = inv.find(x => x.rest === x.v && Math.abs(x.v + p.v) < 0.01 && x.ds <= p.ds);
      if (hit) hit.rest = 0; else pay -= p.v;
    }
    for (const x of inv) { if (pay <= 0.005) break; const k = Math.min(x.rest, pay); x.rest -= k; pay -= k; }
    for (const x of inv) if (x.rest > 0.005) items.push({ tiers: t, piece: x.open ? 'Report à nouveau' : x.pc, date: x.ds, due: x.ds + term, open: x.rest });
    if (pay > 0.005) items.push({ tiers: t, piece: 'Paiement non imputé / avance', date: refSerial, due: refSerial, open: -pay });
  }
  return items;
}

/** Lecture d'une balance âgée importée : une ou plusieurs feuilles, colonnes reconnues par leur en-tête. */
async function agImport(file) {
  const sheets = [];
  if (/\.(xlsx|xlsm)$/i.test(file.name)) {
    const wb = await openWorkbook(file);
    for (const sh of wb.sheets) { const rows = []; for await (const r of xlsxSheetRows(wb.buf, wb.dir[sh.path], wb.sst)) { rows.push(r); if (rows.length > 50000) break; } sheets.push({ name: sh.name, rows }); }
  } else { const txt = await csvText(file); sheets.push({ name: file.name, rows: csvRecords(txt, csvSep(txt.split(/\r?\n/).slice(0, 20))) }); }
  const out = { C: [], F: [] }, nh = s => normH(String(s ?? ''));
  for (const sh of sheets) {
    const hi = sh.rows.findIndex(r => r && r.some(v => /tiers|client|fournisseur|relation|nom/.test(nh(v))) && r.some(v => /solde|ouvert|montant|reste|open|amount/.test(nh(v))));
    if (hi < 0) continue;
    const h = sh.rows[hi].map(nh), col = re => h.findIndex(x => re.test(x));
    const cT = col(/^(tiers|client|fournisseur|relation|nom|name)/), cP = col(/piece|facture|numero|^n |document|invoice/), cD = col(/^date|date facture|date doc/),
      cE = col(/echeance|due/), cO = [col(/solde ouvert|solde|ouvert|reste|open/), col(/montant|amount|ttc/)].find(i => i >= 0), cK = col(/^type$|nature/);
    if (cT < 0 || cO === undefined) continue;
    const defKind = /fourn|suppl|lever|crediteur|payable/i.test(sh.name) ? 'F' : 'C';
    const dc = sh.rows.slice(hi + 1, hi + 40).some(r => /,\d{1,2}$/.test(String(r[cO] ?? '')));
    for (const r of sh.rows.slice(hi + 1)) {
      if (!r || !String(r[cT] ?? '').trim() || /^total/i.test(String(r[cT]))) continue;
      const open = rawNumber(r[cO], dc); if (!Number.isFinite(open) || Math.abs(open) < 0.005) continue;
      const d = cD >= 0 ? rawDate(r[cD], 'dmy') : null, e = cE >= 0 ? rawDate(r[cE], 'dmy') : null;
      const kind = cK >= 0 && /fourn|suppl/i.test(String(r[cK])) ? 'F' : cK >= 0 && /client|cust/i.test(String(r[cK])) ? 'C' : defKind;
      out[kind].push({ tiers: String(r[cT]).trim(), piece: cP >= 0 ? String(r[cP] ?? '') : '', date: d ? d.serial : null, due: e ? e.serial : (d ? d.serial + (kind === 'C' ? S.ag.termC : S.ag.termF) : null), open });
    }
  }
  if (!out.C.length && !out.F.length) throw new Error("Aucune ligne reconnue : il faut au moins une colonne « Tiers » (ou Client / Fournisseur) et une colonne « Solde » ou « Montant ouvert ».");
  return { name: file.name, ...out, at: new Date().toISOString() };
}

function agAnalyse(items, refSerial) {
  const tiers = new Map(); const tot = AG_BUCKETS.map(() => 0); let all = 0, n = 0, maxLate = 0;
  for (const x of items) {
    const late = x.due ? refSerial - x.due : 0, b = agBucket(late);
    x.late = late; x.b = b; tot[b] += x.open; all += x.open; n++; maxLate = Math.max(maxLate, late);
    let t = tiers.get(x.tiers); if (!t) { t = { tiers: x.tiers, b: AG_BUCKETS.map(() => 0), tot: 0, n: 0, oldest: 0 }; tiers.set(x.tiers, t); }
    t.b[b] += x.open; t.tot += x.open; t.n++; t.oldest = Math.max(t.oldest, late);
  }
  const list = [...tiers.values()].sort((a, b) => b.tot - a.tot);
  const overdue = all - tot[0];
  const top5 = list.slice(0, 5).reduce((s, t) => s + t.tot, 0);
  return { items, list, tot, all, n, overdue, over90: tot[4] + tot[5], over180: tot[5], top5, maxLate };
}

VIEWS.aged = () => {
  const M = S.M, G = S.ag;
  if (!G.imp) { try { G.imp = JSON.parse(localStorage.getItem(agKey()) || 'null'); } catch (e) { G.imp = null; } }
  const y = S.y, m = S.m, refSerial = dateToSerial(y, m, new Date(Date.UTC(y, m, 0)).getUTCDate());
  const kind = G.kind, term = kind === 'C' ? G.termC : G.termF;
  const src = G.src === 'imp' && G.imp ? 'imp' : 'gl';
  const items = src === 'imp' ? G.imp[kind].map(x => ({ ...x })) : agFromGl(M, kind, refSerial, term);
  const A = agAnalyse(items, refSerial);
  // solde du grand livre (comptes 40 / 44) et chiffre d'affaires / achats des 12 derniers mois pour le DSO / DPO
  const rv = kind === 'C' ? M.bal('Actuals', y, ['409'], m) : 0;   // réductions de valeur actées (crédit)
  const glBal = kind === 'C' ? M.bal('Actuals', y, ['40'], m) - rv : -M.bal('Actuals', y, ['44'], m);
  const flow12 = prefs => { let s = M.flow('Actuals', y, prefs, 1, m); if (m < 12 && M.yearsOf('Actuals').includes(y - 1)) s += M.flow('Actuals', y - 1, prefs, m + 1, 12); return s; };
  const base = kind === 'C' ? -flow12(['70']) * 1.21 : flow12(['60', '61']) * 1.21;
  const days = base > 0 ? A.all / base * 365 : NaN;
  const ecart = A.all - glBal;
  const q = G.q.trim().toLowerCase();
  const rows = A.list.filter(t => !q || t.tiers.toLowerCase().includes(q));
  const lab = kind === 'C' ? 'clients' : 'fournisseurs';
  const late = A.items.filter(x => x.b >= 3).sort((a, b) => b.late - a.late);
  const alerts = [];
  if (A.all > 0 && A.top5 / A.all > 0.5) alerts.push(`Concentration : les 5 premiers ${lab} représentent ${pct(A.top5 / A.all)} du solde ouvert.`);

/* --------------------------------------------------- fiche des tiers -- */
const exNorm = s => String(s ?? '').trim().toLowerCase().replace(/\s+/g, ' ');

function exAttrs() {

function exSaveAttrs() { try { localStorage.setItem(EX_ATTR_KEY, JSON.stringify(exAttrs())); } catch (e) { /* stockage indisponible */ } }

function exMergeAttrs(src, keep = true) {

const exAttrOf = (name, col) => { const r = exAttrs().t[exNorm(name)]; return (r && r[col]) || EX_NA; };

/* ------------------------------------------------------- dimensions -- */
let EX_RUB = null;
function exRubriqueOf(acc) {
  if (!EX_RUB) {

    EX_RUB.sort((a, b) => b[0].length - a[0].length);

/** Tiers « effectif » de chaque ligne : le sien, sinon celui de la ligne client/fournisseur de la même pièce

function exTiersEff(M) {
  if (M._exT && M._exT.length === M.L.n) return M._exT;
  const L = M.L, P = L.pools, out = new Int32Array(L.n), by = new Map();
  const empty = P.tiers.map.get('') ?? -1, noPc = P.pc.map.get('') ?? -1;
  const ctp = P.acc.list.map(a => a.startsWith('40') || a.startsWith('44'));
  const has = t => t !== undefined && t !== empty && !!P.tiers.list[t];
  for (let i = 0; i < L.n; i++) {
    if (!has(L.tiers[i]) || L.pc[i] === noPc || !P.pc.list[L.pc[i]]) continue;
    const k = L.jr[i] + '|' + L.pc[i] + '|' + L.y[i];
    if (!by.has(k) || ctp[L.acc[i]]) { if (!by.has(k) || !by.get(k)[1]) by.set(k, [L.tiers[i], ctp[L.acc[i]]]); }
  }
  for (let i = 0; i < L.n; i++) {
    if (has(L.tiers[i])) { out[i] = L.tiers[i]; continue; }
    const h = by.get(L.jr[i] + '|' + L.pc[i] + '|' + L.y[i]);

/* ----------------------------------------------------------- calcul -- */
function exPrefixes(E) {

  return { inc: parts.filter(p => p[0] !== '-'), exc: parts.filter(p => p[0] === '-').map(p => p.slice(1)) };
}
function exCompute(M, E, D) {
  const L = M.L, P = L.pools;

  const accCls = P.acc.list.map(a => a[0]);
  const scId = E.sc === 'cur' ? P.sc.map.get(S.sc) : E.sc === 'all' ? -1 : P.sc.map.get(E.sc);
  const years = E.yr === 'cur' ? new Set([S.y]) : E.yr === 'all' ? null : new Set([+E.yr]);
  const socId = M.soc ? P.soc.map.get(M.soc) : -1, opId = M.opening ? P.jr.map.get(M.opening) : -1;
  const flt = E.filters.filter(f => D[f.d]).map(f => ({ key: D[f.d].key, vals: new Set(f.vals), not: f.not }));
  const ax = D[E.axis] || D.tiers, se = E.series && D[E.series] ? D[E.series] : null;
  const val = { abs: i => (accCls[L.acc[i]] === '7' ? -L.mt[i] : L.mt[i]), mt: i => L.mt[i], inv: i => -L.mt[i], deb: i => L.deb[i], cred: i => L.cred[i], n: () => 1 }[E.measure] || (i => L.mt[i]);

    if (years && !years.has(L.y[i])) continue;
    if (L.m[i] < E.m1 || L.m[i] > E.m2) continue;
    if (socId >= 0 && L.soc[i] !== socId) continue;
    if (!E.open && L.jr[i] === opId) continue;

  for (const row of cube.values()) for (const [s, v] of row) sTot.set(s, (sTot.get(s) || 0) + v);
  let sKeys = [...sTot.keys()];
  if (se && se.time) sKeys.sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  else sKeys.sort((a, b) => Math.abs(sTot.get(b)) - Math.abs(sTot.get(a)));
  if (se && sKeys.length > 8) {
    const keep = new Set(sKeys.slice(0, 7));
    for (const row of cube.values()) { let o = 0; for (const [s, v] of [...row]) if (!keep.has(s)) { o += v; row.delete(s); } if (o) row.set(EX_OTHER, (row.get(EX_OTHER) || 0) + o); }
    sKeys = sKeys.slice(0, 7).concat([EX_OTHER]);
  }
  const lab = (dim, k) => (k === EX_OTHER || !dim || !dim.lab ? k : dim.lab(k));
  const grid = keys.map(k => sKeys.map(s => cube.get(k).get(s) || 0));
  return { keys, sKeys, grid, n, tot, ax, se, axLab: keys.map(k => lab(ax, k)), sLab: sKeys.map(s => (se ? lab(se, s) : 'Total')) };
}

/** Valeurs affichées : brutes, en % du total, en % par barre (100 %) ou cumulées. */
function exShown(R, E) {
  let grid = R.grid.map(r => r.slice());
  if (E.cum && R.ax.time) for (let c = 0; c < R.sKeys.length; c++) { let s = 0; for (const r of grid) { s += r[c]; r[c] = s; } }
  if (E.type === 'stack100') grid = grid.map(r => { const t = r.reduce((s, v) => s + Math.abs(v), 0); return r.map(v => (t ? Math.abs(v) / t : 0)); });
  else if (E.pct) { const t = R.tot; grid = grid.map(r => r.map(v => (t ? v / t : 0))); }
  return { grid };
}

function exValues(M, E, dim) {
  const L = M.L, seen = new Map();
  const step = L.n > 200000 ? 3 : 1;   // échantillonnage léger pour les très gros fichiers
  for (let i = 0; i < L.n; i += step) { const k = dim.key(i); seen.set(k, (seen.get(k) || 0) + Math.abs(L.mt[i])); }
  let list = [...seen.keys()];
  if (dim.time) list.sort((a, b) => a.localeCompare(b, 'fr', { numeric: true }));
  else list.sort((a, b) => seen.get(b) - seen.get(a));
  return list.slice(0, 400).map(k => [k, dim.lab ? dim.lab(k) : k]);
}

function exDraw(R, shown, E, unit) {
  const P = palette(), isPct = E.pct || E.type === 'stack100';
  const valFmt = v => (isPct ? pct(v) : (E.measure === 'n' ? NF0.format(v) : fmt(v) + unit));
  const axisTicks = { ticks: { callback: v => (isPct ? pct(v, 1) : E.measure === 'n' ? NF0.format(v) : fmtK(v)) } };
  const cut = s => (s.length > 34 ? s.slice(0, 33) + '…' : s);
  const labels = R.axLab.map(cut);
  const plugins = { legend: { display: !!R.se || E.type === 'donut', position: 'bottom', labels: { boxWidth: 12 } },
    tooltip: { callbacks: { title: it => R.axLab[it[0].dataIndex], label: c => `${c.dataset.label && R.se ? c.dataset.label + ' : ' : ''}${valFmt(E.type === 'donut' ? c.raw : E.type === 'barh' ? c.parsed.x : c.parsed.y)}` } } };
  const onClick = (ev, els) => {
    if (!els.length) return;
    const k = R.keys[els[0].index];
    if (k === EX_OTHER) return;
    S.ex.filters.push({ d: E.axis, vals: [k], not: false }); setTimeout(render, 0);   // après la fin de l'événement Chart.js
  };
  let cfg;
  if (E.type === 'donut') {
    const data = shown.grid.map(r => r.reduce((s, v) => s + v, 0));
    cfg = { type: 'doughnut', data: { labels, datasets: [{ data, backgroundColor: labels.map((_, i) => P[i % P.length]), borderColor: cssVar('--panel') }] },
      options: { plugins: { ...plugins, legend: { position: 'right', labels: { boxWidth: 12 } } }, onClick, cutout: '55%' } };
  } else {
    const line = E.type === 'line' || E.type === 'area', stacked = ['stack', 'stack100', 'area'].includes(E.type), horiz = E.type === 'barh';
    const datasets = R.sKeys.map((s, c) => ({ label: R.sLab[c], data: shown.grid.map(r => r[c]),
      backgroundColor: R.se ? P[c % P.length] + (E.type === 'area' ? '99' : '') : P[0], borderColor: R.se ? P[c % P.length] : P[0],
      fill: E.type === 'area', tension: 0.25, pointRadius: line ? 3 : 0 }));
    const vAxis = { ...axisTicks, stacked, ...(E.type === 'stack100' ? { max: 1 } : {}) }, cAxis = { stacked, ticks: { autoSkip: !horiz } };
    cfg = { type: line ? 'line' : 'bar', data: { labels, datasets },
      options: { indexAxis: horiz ? 'y' : 'x', plugins, onClick, scales: horiz ? { x: vAxis, y: cAxis } : { x: cAxis, y: vAxis },
        onHover: (ev, els) => { ev.native.target.style.cursor = els.length ? 'pointer' : 'default'; } } };
  }
  mkChart('c-ex', cfg);
}

/* --------------------------------------------- vue : fiche des tiers -- */
function exTiersList(M) {
  const L = M.L, P = L.pools, vol = new Map(), role = new Map();
  const socId = M.soc ? P.soc.map.get(M.soc) : -1;
  const r40 = P.acc.list.map(a => (a.startsWith('40') ? 'C' : a.startsWith('44') ? 'F' : ''));
  for (let i = 0; i < L.n; i++) {
    if (socId >= 0 && L.soc[i] !== socId) continue;
    const t = L.tiers[i]; if (!P.tiers.list[t]) continue;
    vol.set(t, (vol.get(t) || 0) + Math.abs(L.mt[i]));
    const r = r40[L.acc[i]]; if (r) role.set(t, (role.get(t) || '').includes(r) ? role.get(t) : (role.get(t) || '') + r);
  }
  return [...vol.keys()].sort((a, b) => vol.get(b) - vol.get(a))
    .map(t => ({ name: P.tiers.list[t], vol: vol.get(t), role: (role.get(t) || '').split('').sort().map(c => (c === 'C' ? 'Client' : 'Fournisseur')).join(' / ') }));
}

async function exImportAttrs(file) {
  let rows;
  if (/\.(xlsx|xlsm)$/i.test(file.name)) {
    const wb = await openWorkbook(file); if (!wb.sheets.length) throw new Error('Aucune feuille dans ce classeur.');
    rows = []; for await (const r of xlsxSheetRows(wb.buf, wb.dir[wb.sheets[0].path], wb.sst)) { rows.push(r.map(v => (v === undefined || v === null ? '' : String(v)))); if (rows.length > 100000) break; }
  } else {
    const txt = await csvText(file); const lines = txt.split(/\r?\n/).slice(0, 20);
    rows = csvRecords(txt, csvSep(lines));
  }
  rows = rows.filter(r => r.some(v => String(v).trim()));
  if (rows.length < 2) throw new Error("Le fichier doit contenir une ligne d'en-tête et au moins un tiers.");
  const h = rows[0].map(v => String(v).trim());
  let ti = h.findIndex(x => /tiers|fournisseur|client|nom|name|relation|partenaire/i.test(x)); if (ti < 0) ti = 0;
  const skip = new Set([ti, ...h.map((x, j) => (/^(rôle|role|volume)/i.test(x) ? j : -1)).filter(j => j >= 0)]);
  const cols = h.map((x, j) => (skip.has(j) || !x ? null : x));
  const src = { cols: cols.filter(Boolean), t: {} };
  for (const r of rows.slice(1)) {
    const k = exNorm(r[ti]); if (!k) continue;
    const rec = src.t[k] || (src.t[k] = {});
    cols.forEach((c, j) => { if (c && String(r[j] ?? '').trim()) rec[c] = String(r[j]).trim(); });
  }
  const n = exMergeAttrs(src, false);
  const known = new Set(exTiersList(S.M).map(t => exNorm(t.name)));
  const match = Object.keys(src.t).filter(k => known.has(k)).length;
  S.flash = { cls: 'ok', html: `${esc(file.name)} : ${NF0.format(Object.keys(src.t).length)} tiers lus (${NF0.format(match)} reconnus dans ce grand livre), ${NF0.format(n)} valeurs enregistrées${src.cols.length ? ` — colonnes ${src.cols.map(esc).join(', ')}` : ''}.` };
}

function exExportAttrs() {
  const A = exAttrs(), q = s => (/[;"\n]/.test(s) ? `"${String(s).replace(/"/g, '""')}"` : s);
  const lines = [['Tiers', 'Rôle', 'Volume', ...A.cols].join(';')];
  for (const t of exTiersList(S.M)) { const r = A.t[exNorm(t.name)] || {}; lines.push([q(t.name), t.role, Math.round(t.vol), ...A.cols.map(c => q(r[c] || ''))].join(';')); }
  download('fiche_des_tiers.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function exExportCsv() {
  const E = S.ex, D = exDims(S.M), R = exCompute(S.M, E, D), sh = exShown(R, E), isPct = E.pct || E.type === 'stack100';
  const n2 = v => (isPct ? String(Math.round(v * 10000) / 100) : String(Math.round(v * 100) / 100)).replace('.', ',');
  const q = s => (/[;"\n]/.test(s) ? `"${String(s).replace(/"/g, '""')}"` : s);
  const lines = [[R.ax.l, ...R.sLab].map(q).join(';')].concat(R.keys.map((k, r) => [q(R.axLab[r]), ...sh.grid[r].map(n2)].join(';')));
  download('explorer.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ==========================================================================
   modules.js — Socle commun des modules de la suite (diagnostic, carbone…)
   Chaque module : dossiers enregistrés dans ce navigateur (localStorage),
   export / import d'un fichier .json, sous-onglets, formulaires liés aux
   données (data-k), listes éditables, rapport imprimable.
   ========================================================================== */
'use strict';

const MOD = {};               // registre : id -> définition
S.mods = {};                  // état par module : { tab, cur }

function modState(id) { return S.mods[id] || (S.mods[id] = { tab: null, cur: null }); }
function modLoad(id) {
  try { const j = JSON.parse(localStorage.getItem(MOD[id].key) || 'null'); if (j && j.docs) return j; } catch (e) { /* */ }
  return { docs: {} };
}
function modSaveAll(id, all) {
  try { localStorage.setItem(MOD[id].key, JSON.stringify(all)); return true; }
  catch (e) { S.flash = { cls: 'bad', html: "Impossible d'enregistrer dans ce navigateur (stockage plein ou désactivé). Exportez le dossier en fichier." }; return false; }
}
function modDoc() { const st = modState(S.app); return st.cur ? modLoad(S.app).docs[st.cur] || null : null; }
function modPut(D) {
  const all = modLoad(S.app); D.meta.updated = new Date().toISOString(); all.docs[D.meta.id] = D; modSaveAll(S.app, all);
}
const modId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* chemins « a.b.0.c » */
function getPath(o, p) { return p.split('.').reduce((x, k) => (x == null ? x : x[k]), o); }
function setPathIn(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((x, k) => x[k], o); t[last] = v; }
const numIn = v => { const n = parseFloat(String(v ?? '').replace(/\s/g, '').replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const nfx = (v, d = 0) => (Number.isFinite(v) ? new Intl.NumberFormat('fr-BE', { minimumFractionDigits: d, maximumFractionDigits: d }).format(v) : '–');

/* ------------------------------------------------ composants de saisie -- */
function fIn(D, k, opts = {}) {
  const v = getPath(D, k);
  const t = opts.num ? 'num' : 'txt';
  const val = v === undefined || v === null ? '' : (opts.num && v !== '' ? String(v).replace('.', ',') : v);
  return `<input class="fi${opts.num ? ' n' : ''}" data-k="${k}" data-t="${t}"${opts.rr !== false ? ' data-rr="1"' : ''} value="${esc(val)}"${opts.ph ? ` placeholder="${esc(opts.ph)}"` : ''}${opts.size ? ` size="${opts.size}"` : ''}${opts.list ? ` list="${opts.list}"` : ''}>`;
}
function fArea(D, k, ph = '', rows = 3) { return `<textarea class="fi" data-k="${k}" data-t="txt" rows="${rows}" placeholder="${esc(ph)}">${esc(getPath(D, k) || '')}</textarea>`; }
function fSel(D, k, list, opts = {}) {
  const v = getPath(D, k);
  return `<select class="fi" data-k="${k}" data-t="${opts.num ? 'num' : 'txt'}" data-rr="1">${list.map(o => { const [a, b] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(a)}"${String(a) === String(v ?? '') ? ' selected' : ''}>${esc(b)}</option>`; }).join('')}</select>`;
}
function fScore(D, k, labels) {
  const v = getPath(D, k);
  return `<span class="score" role="radiogroup">${labels.map((l, i) => `<button class="sc${v === i ? ' on' : ''} s${i}" data-act="mod-score" data-k="${k}" data-v="${i}" title="${esc(l)}">${i}</button>`).join('')}</span>`;
}
const fld = (lab, input, hint = '') => `<label class="mfld"><span>${lab}</span>${input}${hint ? `<small>${hint}</small>` : ''}</label>`;

/** Tableau de lignes éditables. cols : [{k, l, w, num, sel:[...], ph, calc:(row)=>html}] */
function editTable(D, list, cols, opts = {}) {
  const rows = getPath(D, list) || [];
  const body = rows.map((r, i) => `<tr>${cols.map(c => {
    const k = `${list}.${i}.${c.k}`;
    if (c.calc) return `<td class="num">${c.calc(r, i)}</td>`;
    if (c.sel) return `<td>${fSel(D, k, c.sel, { num: c.num })}</td>`;
    if (c.score) return `<td class="c">${fScore(D, k, c.score)}</td>`;
    return `<td>${fIn(D, k, { num: c.num, ph: c.ph, rr: c.rr ?? !!c.num, list: c.list })}</td>`;
  }).join('')}<td class="c"><button class="btn small ghost" data-act="mod-del" data-list="${list}" data-i="${i}" title="Supprimer la ligne">×</button></td></tr>`).join('');
  return `<div class="tw"><table class="t et"><thead><tr>${cols.map(c => `<th class="${c.num || c.calc ? '' : 'l'}"${c.w ? ` style="width:${c.w}"` : ''}>${c.l}</th>`).join('')}<th></th></tr></thead>
    <tbody>${body || `<tr><td colspan="${cols.length + 1}" class="muted l">${opts.empty || 'Aucune ligne.'}</td></tr>`}</tbody></table></div>
    <div class="toolbar no-print" style="margin:8px 0 0"><button class="btn small" data-act="mod-add" data-list="${list}">+ Ajouter une ligne</button>${opts.extra || ''}</div>`;
}

function rerender() {

  if (S.app === 'gl') return S.M ? render() : landing();

}
function modRender() {
  const m = MOD[S.app], st = modState(S.app);

  $('#src').textContent = `${m.docLabel(D)} · modifié le ${new Date(D.meta.updated).toLocaleString('fr-BE', { dateStyle: 'medium', timeStyle: 'short' })} · enregistré dans ce navigateur`;

  S.flash = null;
  if (out.after) out.after(D);

function modListView(m) {
  const all = modLoad(m.id), docs = Object.values(all.docs).sort((a, b) => b.meta.updated.localeCompare(a.meta.updated));

    ${docs.length ? `<div class="card" style="margin-bottom:16px"><h2>Dossiers enregistrés sur cet ordinateur</h2>${tbl(['Dossier', 'Modifié le', ''], docs.map(d => `<tr><td>${esc(m.docLabel(d))}</td><td class="num">${dt(d.meta.updated)}</td>
      <td class="num"><button class="btn small primary" data-act="mod-open" data-id="${esc(d.meta.id)}">Ouvrir</button> <button class="btn small" data-act="mod-dup" data-id="${esc(d.meta.id)}">Dupliquer</button> <button class="btn small" data-act="mod-rm" data-id="${esc(d.meta.id)}">Supprimer</button></td></tr>`).join(''))}</div>` : ''}
    <div class="card"><h2>Nouveau dossier</h2>
      <div class="toolbar" style="margin:0"><label>Nom de l'entreprise<input id="mod-new-name" size="28" placeholder="ex. Dupont SRL" value="${esc(S.ent ? S.ent.nom || '' : '')}"></label>
      <button class="btn primary" data-act="mod-new">Créer</button><span class="muted">ou</span>
      <button class="btn" data-act="mod-demo">Ouvrir l'exemple complété</button><button class="btn" data-act="mod-import">Importer un fichier .json</button></div>
      <p class="note">Les données saisies restent dans ce navigateur, sur cet ordinateur. « Exporter le dossier » crée un fichier à conserver ou à rouvrir ailleurs.</p></div>
    ${m.feats ? `<div class="feats">${m.feats}</div>` : ''}</div>`;
}

function modOpenApp(id) { S.app = id; const st = modState(id); if (st.cur && !modLoad(id).docs[st.cur]) st.cur = null; modRender(); window.scrollTo(0, 0); }

function modNew(name, demo) {
  const m = MOD[S.app];
  const D = demo ? m.demo() : m.blank();
  D.meta = Object.assign(D.meta || {}, { id: modId(), created: new Date().toISOString() });

  modPut(D); modState(S.app).cur = D.meta.id; modState(S.app).tab = null; modRender();

/* ------------------------------------------------------- événements -- */
document.addEventListener('change', e => {
  const t = e.target;
  if (!S.app || S.app === 'gl' || !t.dataset || !t.dataset.k) return;
  const D = modDoc(); if (!D) return;
  const v = t.dataset.t === 'num' ? (t.value.trim() === '' ? '' : numIn(t.value)) : t.value;

document.addEventListener('click', e => {
  const tb = e.target.closest('[data-mtab]');
  if (tb && S.app && S.app !== 'gl') { modState(S.app).tab = tb.dataset.mtab; modRender(); window.scrollTo(0, 0); return; }
  const b = e.target.closest('[data-act^="mod-"]'); if (!b || !S.app || S.app === 'gl') return;
  const m = MOD[S.app], st = modState(S.app), a = b.dataset.act;
  const keep = () => { const sx = window.scrollX, sy = window.scrollY; modRender(); window.scrollTo(sx, sy); };
  switch (a) {
    case 'mod-new': modNew(($('#mod-new-name').value || '').trim() || 'Nouvelle entreprise'); break;
    case 'mod-demo': modNew('', true); break;
    case 'mod-open': st.cur = b.dataset.id; st.tab = null; modRender(); break;
    case 'mod-list': st.cur = null; modRender(); break;
    case 'mod-dup': { const all = modLoad(S.app), src = all.docs[b.dataset.id]; if (!src) break;
      const D = JSON.parse(JSON.stringify(src)); D.meta.id = modId(); D.meta.nom = (D.meta.nom || '') + ' (copie)'; if (m.onDuplicate) m.onDuplicate(D); modPut(D); modRender(); break; }
    case 'mod-rm': { const all = modLoad(S.app), d = all.docs[b.dataset.id];
      if (d && window.confirm(`Supprimer définitivement « ${m.docLabel(d)} » de cet ordinateur ?`)) { delete all.docs[b.dataset.id]; modSaveAll(S.app, all); if (st.cur === b.dataset.id) st.cur = null; modRender(); } break; }
    case 'mod-export': { const D = modDoc(); if (!D) break;
      download(`${m.filePrefix}_${(D.meta.nom || 'dossier').replace(/[^\w-]+/g, '_')}_${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify({ module: m.id, version: 1, data: D }, null, 2)); break; }
    case 'mod-import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json';
      inp.onchange = async () => {
        try {
          const j = JSON.parse(await inp.files[0].text());
          if (!j || j.module !== m.id || !j.data || !j.data.meta) throw new Error(`Ce fichier n'est pas un dossier « ${m.title} ».`);
          const D = Object.assign(m.blank(), j.data); D.meta.id = modId(); modPut(D); st.cur = D.meta.id; st.tab = null;
          S.flash = { cls: 'ok', html: `Dossier « ${esc(m.docLabel(D))} » importé.` };
        } catch (err) { S.flash = { cls: 'bad', html: esc(err.message || 'Fichier illisible.') }; }
        modRender();
      };
      inp.click(); break;
    }
    case 'mod-add': { const D = modDoc(); const list = getPath(D, b.dataset.list); list.push(m.rowTemplate(b.dataset.list, D)); modPut(D); keep(); break; }
    case 'mod-del': { const D = modDoc(); getPath(D, b.dataset.list).splice(+b.dataset.i, 1); modPut(D); keep(); break; }
    case 'mod-score': { const D = modDoc(); const cur = getPath(D, b.dataset.k); setPathIn(D, b.dataset.k, cur === +b.dataset.v ? null : +b.dataset.v); modPut(D); keep(); break; }
    default: if (m.onAction) m.onAction(a, b, keep);
  }
});

const DG_LEVELS = ['0 · Inexistant', '1 · Informel', '2 · Défini, partiel', '3 · Maîtrisé', '4 · Optimisé'];
const DG_AXES = [

/* ------------------------------------------------------------ calculs -- */
function dgCalc(D) {
  const units = D.units.filter(u => u.nom), etp = units.reduce((s, u) => s + numIn(u.etp), 0);
  const byType = Object.fromEntries(DG_TYPES.map(t => [t, units.filter(u => u.type === t).reduce((s, u) => s + numIn(u.etp), 0)]));
  const kids = new Map(); units.forEach(u => { if (u.parent) kids.set(u.parent, (kids.get(u.parent) || 0) + 1); });
  const span = avg([...kids.values()]);
  const byName = new Map(units.map(u => [u.nom, u]));
  const depth = u => { let d = 1, x = u, seen = new Set(); while (x && x.parent && byName.has(x.parent) && !seen.has(x.parent)) { seen.add(x.parent); x = byName.get(x.parent); d++; } return d; };
  const levels = units.length ? Math.max(...units.map(depth)) : 0;
  const keyPeople = units.filter(u => u.cle === 'Oui');
  const orphans = units.filter(u => u.parent && !byName.has(u.parent));
  // maturité
  const axes = DG_AXES.map(([ax, al, qs]) => { const v = avg(qs.map(q => D.q[q[0]])); return { ax, al, v, n: qs.filter(q => Number.isFinite(D.q[q[0]])).length, tot: qs.length }; });
  const answered = Object.values(D.q).filter(Number.isFinite).length, totalQ = Object.keys(DG_Q).length;
  const maturity = avg(axes.map(a => a.v));
  // processus
  const procs = D.procs.filter(p => p.nom).map(p => {
    const sc = avg([p.formal, p.auto, p.ctrl, p.perf]);
    const h = numIn(p.heures), gainH = Number.isFinite(p.auto) ? h * (4 - p.auto) / 4 * numIn(D.params.taux_gain) / 100 : 0;
    return { ...p, sc, h, gainH, gainE: gainH * 12 * numIn(D.params.cout_h) };
  });
  const procH = procs.reduce((s, p) => s + p.h, 0), gainH = procs.reduce((s, p) => s + p.gainH, 0);
  // systèmes
  const sys = D.syst.filter(s => s.nom);
  const sysCost = sys.reduce((s, x) => s + numIn(x.cout), 0);
  const manual = sys.filter(s => s.integ === DG_INTEG[0] || s.integ === DG_INTEG[1]);
  const missing = DG_ESSENTIAL.filter(c => !sys.some(s => s.cat === c));
  return { units, etp, byType, span, levels, keyPeople, orphans, axes, answered, totalQ, maturity, procs, procH, gainH, gainE: gainH * 12 * numIn(D.params.cout_h), sys, sysCost, manual, missing };
}

/** Constats automatiques, du plus grave au moins grave. g : 3 = élevée, 2 = moyenne, 1 = à surveiller. */
function dgFindings(D, C) {
  const F = [];
  for (const [id, q] of Object.entries(DG_Q)) {
    const v = D.q[id]; if (!Number.isFinite(v) || v > 2) continue;
    F.push({ g: v <= 1 ? 3 : 2, axe: q.al, constat: `${q.t} — niveau ${DG_SCORE5[v].toLowerCase()}.${D.qn[id] ? ' ' + D.qn[id] : ''}`, reco: q.r });
  }
  if (C.keyPeople.length) F.push({ g: 3, axe: 'Gouvernance & organisation', constat: `${C.keyPeople.length} fonction${C.keyPeople.length > 1 ? 's' : ''} dépend${C.keyPeople.length > 1 ? 'ent' : ''} d'une seule personne : ${C.keyPeople.map(u => u.nom).join(', ')}.`, reco: 'Prévoir un remplaçant formé et documenter les tâches critiques de ces fonctions.' });
  if (C.etp && C.byType.Support / C.etp > 0.3) F.push({ g: 2, axe: 'Gouvernance & organisation', constat: `Les fonctions support représentent ${pct(C.byType.Support / C.etp)} des ETP.`, reco: 'Vérifier le dimensionnement des fonctions support et automatiser les tâches administratives répétitives.' });
  if (C.span > 8) F.push({ g: 2, axe: 'Gouvernance & organisation', constat: `Étendue de management moyenne élevée (${nfx(C.span, 1)} entités par responsable).`, reco: 'Introduire un niveau intermédiaire ou des référents pour alléger le management direct.' });
  if (C.orphans.length) F.push({ g: 1, axe: 'Gouvernance & organisation', constat: `Rattachement inconnu pour : ${C.orphans.map(u => u.nom).join(', ')}.`, reco: 'Compléter l\'organigramme (entité de rattachement).' });
  for (const p of C.procs) {
    if (Number.isFinite(p.auto) && p.auto <= 1 && p.h >= 20) F.push({ g: 3, axe: 'Processus', constat: `« ${p.nom} » : ${nfx(p.h)} h/mois, peu automatisé.${p.irritants ? ' ' + p.irritants : ''}`, reco: `Automatiser « ${p.nom} » (interfaces, modèles, workflow) : gain estimé ${nfx(p.gainH)} h/mois.` });
    else if (Number.isFinite(p.ctrl) && p.ctrl <= 1) F.push({ g: 3, axe: 'Contrôle interne & risques', constat: `« ${p.nom} » : contrôles faibles.${p.irritants ? ' ' + p.irritants : ''}`, reco: `Ajouter des points de contrôle à « ${p.nom} » (validation, séparation des tâches, rapprochements).` });
    else if (Number.isFinite(p.formal) && p.formal <= 1) F.push({ g: 2, axe: 'Processus', constat: `« ${p.nom} » n'est pas formalisé.`, reco: `Documenter « ${p.nom} » : étapes, responsables, outils, délais.` });
  }
  for (const s of C.sys) {
    if (s.integ === DG_INTEG[0] && s.crit !== 'Faible') F.push({ g: 3, axe: 'Systèmes & données', constat: `${s.nom} (${s.cat}) : données ressaisies à la main.${s.notes ? ' ' + s.notes + '.' : ''}`, reco: `Mettre en place un import automatique ou un connecteur pour ${s.nom}.` });
    if (Number.isFinite(s.satisf) && s.satisf <= 1) F.push({ g: 2, axe: 'Systèmes & données', constat: `${s.nom} : satisfaction faible des utilisateurs.`, reco: `Évaluer l'optimisation ou le remplacement de ${s.nom}.` });
  }
  if (C.sys.length && C.missing.length) F.push({ g: 2, axe: 'Systèmes & données', constat: `Fonctions non couvertes par un outil identifié : ${C.missing.join(', ')}.`, reco: 'Vérifier comment ces besoins sont couverts aujourd\'hui (tableur, papier, prestataire) et s\'il faut un outil.' });
  return F.sort((a, b) => b.g - a.g);
}

function dgOrgTree(C) {
  const byParent = new Map(); C.units.forEach(u => { const p = C.units.some(x => x.nom === u.parent) ? u.parent : ''; if (!byParent.has(p)) byParent.set(p, []); byParent.get(p).push(u); });
  const node = (u, seen) => {
    if (seen.has(u.nom)) return ''; seen.add(u.nom);
    const ch = byParent.get(u.nom) || [];
    return `<li><div class="org-n t-${(u.type || '').toLowerCase()}${u.cle === 'Oui' ? ' key' : ''}"><b>${esc(u.nom)}</b><span>${esc(u.resp || '')}</span><small>${nfx(numIn(u.etp), numIn(u.etp) % 1 ? 1 : 0)} ETP${u.cle === 'Oui' ? ' · personne clé' : ''}</small></div>${ch.length ? `<ul>${ch.map(c => node(c, seen)).join('')}</ul>` : ''}</li>`;
  };
  const roots = byParent.get('') || [];
  return roots.length ? `<div class="org"><ul>${roots.map(r => node(r, new Set())).join('')}</ul></div>` : '<p class="muted">Ajoutez des entités dans l\'onglet Structure pour voir l\'organigramme.</p>';
}

  },
  ent(D) {
    const glInfo = S.M ? (() => { const y = S.M.yearsOf('Actuals').slice(-1)[0]; if (!y) return ''; const pl = S.M.pl('Actuals', y); return `<div class="alert info">Grand livre ouvert dans la suite (${esc(S.M.soc || S.M.source.split(' › ')[0])}) : CA ${y} ${fmtK(pl.ca)}, frais de personnel ${fmtK(-S.M.flow('Actuals', y, ['62']))}. <button class="btn small" data-act="mod-dg-gl" data-ca="${Math.round(pl.ca)}">Reprendre le CA</button></div>`; })() : '';

      ${fld('Objectifs de la direction', fArea(D, 'meta.objectifs', '', 3))}</div>` };
  },

      <div class="kpis"><div class="card kpi"><div class="lab">Entités</div><div class="val">${C.units.length}</div></div>
        <div class="card kpi"><div class="lab">ETP</div><div class="val">${nfx(C.etp, C.etp % 1 ? 1 : 0)}</div>${numIn(D.meta.effectif) && Math.abs(numIn(D.meta.effectif) - C.etp) > 0.5 ? `<div class="sub">≠ effectif déclaré (${nfx(numIn(D.meta.effectif), 1)})</div>` : ''}</div>

    after() {
      const P = palette();
      if (C.etp) mkChart('c-dg-etp', { type: 'doughnut', data: { labels: DG_TYPES, datasets: [{ data: DG_TYPES.map(t => C.byType[t]), backgroundColor: [P[3], P[0], P[1]], borderColor: cssVar('--panel') }] },
        options: { plugins: { legend: { position: 'right' }, tooltip: { callbacks: { label: c => `${c.label} : ${nfx(c.raw, 1)} ETP (${pct(c.raw / C.etp)})` } } } } });
    } };
  },
  proc(D) {

      <div class="kpis"><div class="card kpi"><div class="lab">Processus suivis</div><div class="val">${C.procs.length}</div></div>
        <div class="card kpi"><div class="lab">Temps consacré</div><div class="val">${nfx(C.procH)} h/mois</div></div>

      <div class="card"><div class="tw"><table class="t et proc"><thead><tr><th class="l">Processus</th><th class="l">Responsable</th><th class="l">Outils</th><th class="l">Volume</th><th>Heures / mois</th><th>Formalisation</th><th>Automatisation</th><th>Contrôles</th><th>Performance</th><th>Score</th><th></th></tr></thead><tbody>
        ${D.procs.map((p, i) => { const c = dgProcRow(D, p); return `<tr><td>${fIn(D, `procs.${i}.nom`, { rr: true })}</td><td>${fIn(D, `procs.${i}.owner`, { rr: false })}</td><td>${fIn(D, `procs.${i}.outils`, { rr: false })}</td><td>${fIn(D, `procs.${i}.volume`, { rr: false, size: 10 })}</td><td>${fIn(D, `procs.${i}.heures`, { num: true, size: 5 })}</td>
          ${['formal', 'auto', 'ctrl', 'perf'].map(k => `<td class="c">${fScore(D, `procs.${i}.${k}`, DG_SCORE5)}</td>`).join('')}<td class="num">${dgScore(c.sc)}</td><td class="c"><button class="btn small ghost" data-act="mod-del" data-list="procs" data-i="${i}">×</button></td></tr>

      <p class="note">Gain potentiel = heures × (4 − automatisation) / 4 × ${nfx(numIn(D.params.taux_gain))} % (paramètres dans l'onglet Entreprise).</p></div>

    } };

  sys(D) {
    const C = dgCalc(D);

        <div class="card kpi"><div class="lab">Coût annuel</div><div class="val">${fmtK(C.sysCost)}</div>${numIn(D.meta.effectif) ? `<div class="sub">${nfx(C.sysCost / numIn(D.meta.effectif))} € par ETP</div>` : ''}</div>
        <div class="card kpi"><div class="lab">Échanges manuels ou par fichiers</div><div class="val">${C.manual.length}</div></div>

      <div class="card">${editTable(D, 'syst', [
        { k: 'nom', l: 'Outil', ph: 'ex. Sage BOB', rr: true }, { k: 'cat', l: 'Catégorie', sel: DG_SYSCAT }, { k: 'usage', l: 'Usage' },
        { k: 'users', l: 'Utilisateurs', num: true, w: '80px' }, { k: 'cout', l: 'Coût annuel (€)', num: true, w: '110px' },

        { k: 'crit', l: 'Criticité', sel: ['Élevée', 'Moyenne', 'Faible'] }, { k: 'notes', l: 'Remarques' }], { empty: 'Listez les logiciels et services utilisés (ERP, banque, paie, CRM, tableurs…).' })}</div>
      ${C.sys.length ? `<div class="card" style="margin-top:16px"><h2>Cartographie des échanges</h2><div class="sysmap">${DG_INTEG.map((g, gi) => `<div class="col g${gi}"><b>${esc(g)}</b>${C.sys.filter(s => s.integ === g).map(s => `<span class="pill">${esc(s.nom)}<small>${esc(s.cat)}</small></span>`).join('') || '<span class="muted">—</span>'}</div>`).join('')}</div>
        <p class="note">Colonne de gauche : ressaisies à supprimer en priorité ; colonne de droite : flux intégrés.</p></div>` : ''}` };
  },
  quest(D) {

        ${qs.map(([id, t]) => `<div class="qrow"><div class="qt">${esc(t)}</div><div class="qs">${fScore(D, `q.${id}`, DG_LEVELS)}</div><div class="qn">${fIn(D, `qn.${id}`, { rr: false, ph: 'Commentaire (facultatif)' })}</div></div>`).join('')}</div>`; }).join('')}` };
  },
  plan(D) {
    const C = dgCalc(D), F = dgFindings(D, C);
    const prio = a => (numIn(a.impact) * 2 - numIn(a.effort));
    const acts = D.actions.map((a, i) => ({ ...a, i })).sort((a, b) => prio(b) - prio(a));

    const gain = D.actions.filter(a => a.statut !== 'Abandonné').reduce((s, a) => s + numIn(a.gain_h), 0);
    return { html: `<h1 class="view">Plan d'action</h1><p class="lead">Actions retenues, priorisées par impact et effort (1 faible · 2 moyen · 3 élevé). Les gains de temps saisis sont valorisés au coût horaire de l'onglet Entreprise.</p>
      <div class="kpis"><div class="card kpi"><div class="lab">Actions</div><div class="val">${D.actions.length}</div></div><div class="card kpi"><div class="lab">Gains rapides</div><div class="val">${qw}</div><div class="sub">impact ≥ moyen, effort faible</div></div>
        <div class="card kpi"><div class="lab">Gain de temps visé</div><div class="val">${nfx(gain)} h/mois</div><div class="sub">≈ ${fmtK(gain * 12 * numIn(D.params.cout_h))} par an</div></div></div>
      <div class="card">${editTable(D, 'actions', [
        { k: 'titre', l: 'Action', rr: true }, { k: 'axe', l: 'Axe', sel: DG_AXES.map(a => a[1]) }, { k: 'impact', l: 'Impact', sel: [[1, '1 · faible'], [2, '2 · moyen'], [3, '3 · élevé']], num: true },
        { k: 'effort', l: 'Effort', sel: [[1, '1 · faible'], [2, '2 · moyen'], [3, '3 · élevé']], num: true }, { k: 'owner', l: 'Responsable' }, { k: 'echeance', l: 'Échéance', ph: 'ex. T1 2027' },
        { k: 'gain_h', l: 'Gain (h/mois)', num: true, w: '90px' }, { k: 'statut', l: 'Statut', sel: DG_STATUS }], { empty: 'Ajoutez des actions, ou reprenez les constats ci-dessous avec « + Plan ».' })}</div>

        <div class="card"><h2>Ordre de priorité</h2>${acts.length ? tbl(['#', 'Action', 'Impact', 'Effort', 'Statut'], acts.map((a, k) => `<tr><td class="num">${k + 1}</td><td class="l">${esc(a.titre)}</td><td class="num">${a.impact || '–'}</td><td class="num">${a.effort || '–'}</td><td>${esc(a.statut || '')}</td></tr>`).join('')) : '<p class="muted">—</p>'}</div></div>

  rapport(D) {
    const C = dgCalc(D), F = dgFindings(D, C);

    const strengths = Object.entries(DG_Q).filter(([id]) => D.q[id] >= 3).map(([, q]) => q.t);

      ${D.meta.contexte ? `<p><b>Contexte.</b> ${esc(D.meta.contexte)}</p>` : ''}${D.meta.objectifs ? `<p><b>Objectifs.</b> ${esc(D.meta.objectifs)}</p>` : ''}

        <div>${tbl(['Axe', 'Score /4', 'Niveau'], C.axes.map(a => `<tr><td>${esc(a.al)}</td><td class="num">${dgScore(a.v)}</td><td>${Number.isFinite(a.v) ? DG_SCORE5[Math.round(a.v)] : '–'}</td></tr>`).join(''))}</div></div>

      ${C.keyPeople.length ? `Fonctions dépendant d'une seule personne : ${C.keyPeople.map(u => esc(u.nom)).join(', ')}.` : ''}</p>

      <h2>3. Processus</h2>
      ${C.procs.length ? tbl(['Processus', 'Responsable', 'h/mois', 'Form.', 'Auto.', 'Contr.', 'Perf.', 'Gain h/mois'], C.procs.map(p => `<tr><td class="l">${esc(p.nom)}</td><td class="l">${esc(p.owner || '')}</td><td class="num">${nfx(p.h)}</td>${['formal', 'auto', 'ctrl', 'perf'].map(k => `<td class="num">${Number.isFinite(p[k]) ? p[k] : '–'}</td>`).join('')}<td class="num">${nfx(p.gainH)}</td></tr>`).join('')) : '<p class="muted">Non renseigné.</p>'}
      ${C.procs.filter(p => p.irritants).map(p => `<p class="small"><b>${esc(p.nom)}.</b> ${esc(p.irritants)}</p>`).join('')}
