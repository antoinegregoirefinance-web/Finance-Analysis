<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Garantie technique de confidentialité : la page ne peut se connecter qu'à deux services publics
     (Banque nationale de Belgique - Centrale des bilans, et VIES de la Commission européenne), et seulement
     quand l'utilisateur clique sur « Télécharger » ; elle n'y envoie que le numéro d'entreprise.
     Aucun serveur, aucun CDN, aucune télémétrie : tout le reste est inclus dans ce fichier. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src https://ws.cbso.nbb.be https://ec.europa.eu; form-action 'none'; base-uri 'none'">
<title>Altesia Finance — Suite</title>
<style>:root {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #f9fafb; --ink: #17202e; --ink-2: #4a5566; --ink-3: #7b8594;
  --line: #e3e6eb; --line-2: #eef0f3; --accent: #0f5ea8; --accent-2: #e8f0fa; --accent-ink: #0b4a86;
  --pos: #1a7f4b; --neg: #b42318; --warn: #b26b00; --warn-bg: #fff6e5; --ok-bg: #e9f7ef; --bad-bg: #fdecea;
  --c1: #0f5ea8; --c2: #e07a1f; --c3: #2a9d8f; --c4: #8e5bb5; --c5: #c8475b; --c6: #6b7c93; --c7: #b8a031;
  --input: #fffbe6; --input-line: #e7d38a;
  --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .08);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --panel: #161d27; --panel-2: #1b2430; --ink: #e8edf3; --ink-2: #b4bfcc; --ink-3: #8592a3;
    --line: #2a3443; --line-2: #222b38; --accent: #5aa2e8; --accent-2: #1a2d44; --accent-ink: #9cc8f2;
    --pos: #4cc38a; --neg: #f07167; --warn: #f2b84b; --warn-bg: #3a2c12; --ok-bg: #12301f; --bad-bg: #3a1714;
    --c1: #5aa2e8; --c2: #f0a04b; --c3: #4cc3b4; --c4: #b48be0; --c5: #f07c8f; --c6: #94a3b8; --c7: #e3cc5a;
    --input: #2b2716; --input-line: #6b5d24; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --panel: #161d27; --panel-2: #1b2430; --ink: #e8edf3; --ink-2: #b4bfcc; --ink-3: #8592a3;
  --line: #2a3443; --line-2: #222b38; --accent: #5aa2e8; --accent-2: #1a2d44; --accent-ink: #9cc8f2;
  --pos: #4cc38a; --neg: #f07167; --warn: #f2b84b; --warn-bg: #3a2c12; --ok-bg: #12301f; --bad-bg: #3a1714;
  --c1: #5aa2e8; --c2: #f0a04b; --c3: #4cc3b4; --c4: #b48be0; --c5: #f07c8f; --c6: #94a3b8; --c7: #e3cc5a;
  --input: #2b2716; --input-line: #6b5d24; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.neg { color: var(--neg); } .pos { color: var(--pos); } .muted { color: var(--ink-3); }

/* ---------- en-tête ---------- */
header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-row { display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.brand small { display: block; font-weight: 400; color: var(--ink-3); font-size: 12px; }
.lock { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--pos); background: var(--ok-bg); padding: 3px 10px; border-radius: 99px; }
.spacer { flex: 1; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.filters label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-3); gap: 2px; }
.filters select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); min-width: 90px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.small { padding: 3px 9px; font-size: 12px; }
nav.tabs { display: flex; flex-wrap: wrap; gap: 0 2px; padding: 0 14px; }
nav.tabs .grp { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); padding: 12px 6px 0 10px; white-space: nowrap; }
nav.tabs button { border: 0; background: none; padding: 10px 11px 9px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap; }
nav.tabs button:hover { color: var(--ink); }
nav.tabs button.on { color: var(--accent-ink); border-bottom-color: var(--accent); font-weight: 600; }

main { padding: 20px; max-width: 1500px; margin: 0 auto; }
h1.view { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
p.lead { margin: 0 0 18px; color: var(--ink-2); max-width: 900px; }
h2 { font-size: 15px; margin: 0 0 10px; }
h3 { font-size: 13px; margin: 14px 0 6px; color: var(--ink-2); }

.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card + .card { margin-top: 0; }
.stack > * + * { margin-top: 16px; }
.kpi .lab { font-size: 12px; color: var(--ink-3); }
.kpi .val { font-size: 22px; font-weight: 650; margin: 4px 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .sub { font-size: 12px; color: var(--ink-3); }
.chart { position: relative; height: 280px; }
.chart.tall { height: 340px; }
.chart.short { height: 220px; }

/* ---------- tableaux ---------- */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
table.t { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
table.t th, table.t td { padding: 6px 10px; border-bottom: 1px solid var(--line-2); }
table.t thead th { background: var(--panel-2); color: var(--ink-2); font-weight: 600; text-align: right; position: sticky; top: 0; z-index: 1; white-space: nowrap; }
table.t thead th:first-child, table.t td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); z-index: 2; min-width: 240px; }
table.t thead th:first-child { background: var(--panel-2); z-index: 3; }
table.t tr.sub td { font-weight: 600; background: var(--panel-2); }
table.t tr.sub td:first-child { background: var(--panel-2); }
table.t tr.tot td { font-weight: 700; border-top: 1px solid var(--line); background: var(--accent-2); }
table.t tr.tot td:first-child { background: var(--accent-2); }
table.t tr.sec td { background: transparent; font-weight: 700; color: var(--accent-ink); padding-top: 14px; text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
table.t tr.child td:first-child { padding-left: 28px; color: var(--ink-2); }
table.t tr.check td { color: var(--ink-3); font-style: italic; }
table.t tr.click td:first-child { cursor: pointer; }
table.t tr.click td:first-child::before { content: "▸ "; color: var(--ink-3); }
table.t tr.click.open td:first-child::before { content: "▾ "; }
table.t td.c { text-align: center; }
table.t tbody tr:hover td { background: var(--panel-2); }
td.l, th.l { text-align: left !important; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; }
.b-ok { background: var(--ok-bg); color: var(--pos); } .b-bad { background: var(--bad-bg); color: var(--neg); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-info { background: var(--accent-2); color: var(--accent-ink); }

/* ---------- saisies ---------- */
input.in, select.in { width: 100%; min-width: 70px; padding: 3px 6px; border: 1px solid var(--input-line); background: var(--input); border-radius: 5px; text-align: right; font-variant-numeric: tabular-nums; }
select.in { text-align: left; }
input.in.txt { text-align: left; }
.note { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
.alert.warn { background: var(--warn-bg); color: var(--warn); }
.alert.bad { background: var(--bad-bg); color: var(--neg); }
.alert.ok { background: var(--ok-bg); color: var(--pos); }
.alert.info { background: var(--accent-2); color: var(--accent-ink); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.toolbar label { display: flex; flex-direction: column; font-size: 11px; color: var(--ink-3); gap: 2px; }
.toolbar input, .toolbar select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.hero { text-align: center; padding: 26px 10px 14px; }
.hero .big { font-size: 34px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }

/* ---------- accueil ---------- */
.landing { max-width: 820px; margin: 40px auto; }
.drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--panel); padding: 46px 24px; text-align: center; cursor: pointer; transition: .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-2); }
.drop .ic { font-size: 34px; }
.drop b { font-size: 16px; display: block; margin: 8px 0 4px; }
.feats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
.feats .card { font-size: 13px; color: var(--ink-2); }
.feats .card b { color: var(--ink); display: block; margin-bottom: 4px; }
.progress { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 16px; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
footer { text-align: center; font-size: 12px; color: var(--ink-3); padding: 24px 10px 40px; }

@media (max-width: 900px) {
  .g2, .g3, .feats { grid-template-columns: 1fr; }
  main { padding: 14px 16px; }
  .top-row { padding: 8px 16px; }
}
@media print {
  header.top nav, .filters, .no-print, footer { display: none !important; }
  header.top { position: static; border: 0; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
  .tw { overflow: visible; }
  main { max-width: none; padding: 0; }
}

.pw { display: flex; align-items: center; gap: 4px; }
.pw::after { content: "%"; color: var(--ink-3); font-size: 11px; }
@media (max-width: 900px) {
  header.top { position: static; }
  nav.tabs { flex-wrap: nowrap; overflow-x: auto; }
}

.chk { flex-direction: row !important; align-items: center; gap: 6px !important; font-size: 12px !important; color: var(--ink-2) !important; padding-bottom: 6px; cursor: pointer; }
.dlg-back { position: fixed; inset: 0; background: rgba(10, 16, 24, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.dlg { width: min(520px, 100%); max-height: 90vh; overflow: auto; }
.dlg label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.dlg label.fld input { padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); }
.dlg label.opt { display: flex; gap: 8px; align-items: center; font-size: 13px; }

/* ---- Explorer ---- */
.ex-presets { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
.ex-grid { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 16px; align-items: start; }
.ex-cfg { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.ex-cfg label { display: flex; flex-direction: column; font-size: 11.5px; color: var(--ink-3); gap: 3px; }
.ex-cfg label.opt { flex-direction: row; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; }
.ex-cfg select, .ex-cfg input:not([type=checkbox]) { padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; }
.ex-cfg select[multiple] { padding: 2px; }
.ex-cfg .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ex-cfg hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; width: 100%; }
.ex-cfg .sub { font-size: 12.5px; }
.hint { font-size: 11px; color: var(--ink-3); font-weight: normal; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 4px 2px 9px; border-radius: 99px; background: var(--bg); border: 1px solid var(--line); font-size: 12px; max-width: 100%; }
.chip button { border: 0; background: none; color: var(--ink-3); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
.chip button.lnk { color: var(--ink); font-size: 12px; padding: 0; }
.chip.view { padding-left: 9px; }
.ex-chart canvas { cursor: default; }
.ex-at input { width: 100%; min-width: 120px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); font: inherit; font-size: 12.5px; }
@media (max-width: 900px) { .ex-grid { grid-template-columns: 1fr; } .ex-cfg { position: static; max-height: none; } }
.ex-cfg .row2 > label { min-width: 0; }
.ex-cfg select, .ex-cfg input:not([type=checkbox]) { width: 100%; min-width: 0; box-sizing: border-box; }
.ex-cfg .toolbar input { width: auto; flex: 1; }

/* ---- Accueil de la suite ---- */
.suite { max-width: 980px; margin: 36px auto; }
.suite-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 18px; }
.suite-app { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; font: inherit; color: var(--ink); cursor: pointer; border: 1px solid var(--line); transition: .15s; min-height: 210px; }
.suite-app:hover:not([disabled]) { border-color: var(--accent); box-shadow: 0 6px 18px rgba(15, 94, 168, .12); transform: translateY(-1px); }
.suite-app .ic { font-size: 30px; line-height: 1; }
.suite-app b { font-size: 17px; }
.suite-app .d { font-size: 13px; color: var(--ink-2); line-height: 1.45; flex: 1; }
.suite-app .tags { display: flex; flex-wrap: wrap; gap: 5px; }
.suite-app .tags .badge:not(.b-warn):not(.b-ok) { background: var(--bg); border: 1px solid var(--line); color: var(--ink-2); }
.suite-app.soon, .suite-app.next { cursor: default; opacity: .8; }
.suite-app.next { border-style: dashed; background: transparent; }
#src:empty + .sep { display: none; }

/* ---- Modules (diagnostic, carbone) ---- */
.mod-doc { font-weight: 600; font-size: 13px; padding: 6px 4px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-3); font-size: 15px; line-height: 1; }
.btn.ghost:hover { color: var(--neg); background: var(--bad-bg); }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px 16px; margin-bottom: 12px; }
.mfld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-3); margin-bottom: 10px; }
.mfld small { font-size: 11px; color: var(--ink-3); }
.fi { padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); color: var(--ink); font: inherit; font-size: 13px; width: 100%; box-sizing: border-box; min-width: 0; }
.fi.n { text-align: right; font-variant-numeric: tabular-nums; }
textarea.fi { resize: vertical; line-height: 1.45; }
.fi:focus { outline: 2px solid var(--accent-2); border-color: var(--accent); }
table.et td { padding: 4px 6px; vertical-align: middle; }
table.et td:first-child { min-width: 200px; }
table.et .fi { min-width: 90px; }
table.et td.num .fi { min-width: 70px; }
table.et tr.sub-row td { border-bottom: 2px solid var(--line); padding-top: 0; }
table.et tr.sub-row td:first-child { position: static; }
table.t tr.used td { background: var(--accent-2); }
.score { display: inline-flex; gap: 2px; }
.score .sc { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-3); font-size: 12px; cursor: pointer; padding: 0; }
.score .sc:hover { border-color: var(--accent); color: var(--ink); }
.score .sc.on.s0 { background: #c8475b; border-color: #c8475b; color: #fff; }
.score .sc.on.s1 { background: #e07a1f; border-color: #e07a1f; color: #fff; }
.score .sc.on.s2 { background: #b8a031; border-color: #b8a031; color: #fff; }
.score .sc.on.s3 { background: #2a9d8f; border-color: #2a9d8f; color: #fff; }
.score .sc.on.s4 { background: #0f5ea8; border-color: #0f5ea8; color: #fff; }
.mat { display: inline-block; min-width: 34px; padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 600; text-align: center; color: #fff; }
.mat.m0 { background: #c8475b; } .mat.m1 { background: #e07a1f; } .mat.m2 { background: #b8a031; } .mat.m3 { background: #2a9d8f; } .mat.m4 { background: #0f5ea8; }
.lvl-legend { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.qax { margin-bottom: 14px; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(180px, 280px); gap: 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line-2); }
.qrow .qt { font-size: 13.5px; }
.org { overflow-x: auto; padding: 6px 0; }
.org ul { list-style: none; margin: 0; padding-left: 22px; position: relative; }
.org > ul { padding-left: 0; }
.org li { position: relative; padding: 5px 0 5px 14px; }
.org ul ul li::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1px solid var(--line); }
.org ul ul li:last-child::before { bottom: 50%; }
.org ul ul li::after { content: ''; position: absolute; left: 0; top: 50%; width: 12px; border-top: 1px solid var(--line); }
.org > ul > li { padding-left: 0; }
.org-n { display: inline-flex; flex-direction: column; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); border-left: 4px solid var(--c1); background: var(--panel); min-width: 170px; }
.org-n span { font-size: 12px; color: var(--ink-2); } .org-n small { font-size: 11px; color: var(--ink-3); }
.org-n.t-direction { border-left-color: var(--c4); } .org-n.t-support { border-left-color: var(--c2); }
.org-n.key { box-shadow: inset 0 0 0 1px var(--neg); }
.sysmap { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.sysmap .col { border-radius: 10px; padding: 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 6px; min-height: 80px; }
.sysmap .col b { font-size: 12px; } .sysmap .g0 { background: var(--bad-bg); } .sysmap .g1 { background: var(--warn-bg); } .sysmap .g3 { background: var(--ok-bg); }
.pill { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; font-size: 12.5px; }
.pill small { color: var(--ink-3); font-size: 11px; }
.small { font-size: 12px; }
.kpi .sub { font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.report { max-width: 980px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 34px 40px; line-height: 1.55; }
.report h2 { margin: 28px 0 10px; font-size: 18px; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
.report h3 { margin: 16px 0 8px; font-size: 14.5px; }
.report p { margin: 8px 0; }
.rp-head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.rp-head h1 { margin: 4px 0; font-size: 26px; } .rp-head p { margin: 0; color: var(--ink-2); }
.rp-kicker { text-transform: uppercase; letter-spacing: .08em; font-size: 11px; color: var(--accent); font-weight: 700; }
.rp-meta { font-size: 12.5px; color: var(--ink-2); text-align: right; }
.report table.t thead th:first-child, .report table.t td:first-child { min-width: 0; position: static; }
@media (max-width: 760px) {
  .qrow { grid-template-columns: 1fr; gap: 6px; }
  .sysmap { grid-template-columns: 1fr 1fr; }
  .report { padding: 20px 16px; } .rp-head { flex-direction: column; } .rp-meta { text-align: left; }
}
@media print {
  .report { border: 0; padding: 0; max-width: none; }
  .report h2 { break-after: avoid; } .report table { break-inside: auto; } .report tr { break-inside: avoid; }
  .score .sc:not(.on) { display: none; }
}

/* ---- Fiche entreprise ---- */
.ent-box { margin: 18px 0 4px; }
.ent-box h3 { font-size: 14px; margin: 18px 0 8px; }
.chip.ent { cursor: pointer; padding: 3px 10px; font: inherit; font-size: 12px; color: var(--ink); }
.chip.ent:hover { border-color: var(--accent); }
.ent-card { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 14px; }
.ent-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 12px; }
.ent-head h2 { margin: 2px 0; font-size: 20px; }

/* ---- Balance âgée ---- */
.alert.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.seg { display: inline-flex; gap: 0; } .seg .btn { border-radius: 0; } .seg .btn:first-child { border-radius: 7px 0 0 7px; } .seg .btn:last-child { border-radius: 0 7px 7px 0; }
table.t td.warn-cell { background: var(--bad-bg); }
.btn.danger { border-color: var(--neg); color: var(--neg); background: var(--panel); }
.btn.danger:hover { background: var(--bad-bg); }
</style>
</head>

<header class="top">
  <div class="top-row">
    <div class="brand" data-act="home" title="Accueil de la suite" style="cursor:pointer"><div class="logo">AF</div><div>Altesia Finance <small>Analyse du grand livre &amp; valorisation</small></div></div>
    <span class="lock" title="Vos fichiers et saisies sont traités dans ce navigateur et n'en sortent pas. La page ne peut joindre que la BNB et VIES, sur demande, en n'envoyant que le numéro d'entreprise.">🔒 Données traitées localement</span>
    <span class="spacer"></span>
    <div class="filters" id="filters"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="view"></main>
<footer><span id="src"></span><span class="sep"> · </span>Altesia Finance, version navigateur — aucune donnée n'est envoyée ni conservée en ligne.</footer>

<input type="file" id="json-in" accept=".json" hidden>

<script>
/* ==========================================================================
   parse.js — Lecture LOCALE du fichier (aucun envoi réseau)
   --------------------------------------------------------------------------
   Formats acceptés : l'export normalisé du GL Analyzer (feuille « GL_complet »)
   ou l'onglet « Données (A Updater) » du tableau de bord Excel, en .xlsx ou en
   .csv. Le .xlsx est décompressé en flux avec DecompressionStream (natif du
   navigateur) : un fichier de 300 000 lignes ne passe jamais en entier en
   mémoire sous forme de texte.
   ========================================================================== */
'use strict';

const GL_FIELDS = {
  // champ interne : en-têtes acceptés (insensible à la casse)
  sc: ['Scenario'], soc: ['Societe'], cat: ['Categorie'], nat: ['Nature'],
  bnb: ['Rubrique_BNB'], tiersE: ['Tiers'], dept: ['Departement'], serv: ['Services'],
  date: ['STD_Date'], y: ['STD_Annee'], m: ['STD_Mois'], acc: ['STD_Compte'],
  sss: ['STD_Sous_sous_Classe'], ss: ['STD_Sous_Classe'],
  deb: ['STD_Debit'], cred: ['STD_Credit'], mt: ['STD_Montant'],
  lib: ['STD_Libelle'], tiers: ['STD_Tiers'], jr: ['STD_Journal'], pc: ['STD_Piece'],
  type: ['Type_Ligne'],
};

/** Petit « pool » de chaînes : chaque texte distinct n'est stocké qu'une fois. */
class Pool {
  constructor() { this.map = new Map(); this.list = []; }
  id(s) {
    let i = this.map.get(s);
    if (i === undefined) { i = this.list.length; this.list.push(s); this.map.set(s, i); }
    return i;
  }
}

/** Stockage en colonnes des écritures (léger en mémoire). */
class Lines {
  constructor() {
    this.n = 0;
    this.pools = { sc: new Pool(), soc: new Pool(), acc: new Pool(), jr: new Pool(), tiers: new Pool(),
      lib: new Pool(), pc: new Pool(), bnb: new Pool(), cat: new Pool(), nat: new Pool(),
      dept: new Pool(), serv: new Pool() };
    for (const k of ['sc', 'soc', 'y', 'm', 'acc', 'jr', 'tiers', 'lib', 'pc', 'bnb', 'cat', 'nat', 'dept', 'serv', 'date', 'deb', 'cred', 'mt'])
      this[k] = [];
  }
}

const XML_ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
function unxml(s) {
  if (s.indexOf('&') < 0) return s;
  return s.replace(/&(#x[0-9a-fA-F]+|#\d+|\w+);/g, (m, e) => {
    if (e[0] === '#') return String.fromCodePoint(e[1] === 'x' ? parseInt(e.slice(2), 16) : parseInt(e.slice(1), 10));
    return XML_ENT[e] ?? m;
  });
}

function toNum(v) {
  if (v === null || v === undefined || v === '') return 0;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s| |€/g, '');
  if (s === '') return 0;
  if (s.indexOf(',') >= 0) s = s.indexOf('.') >= 0 ? s.replace(/\./g, '').replace(',', '.') : s.replace(',', '.');
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : 0;
}

function normAccount(v) {
  let s = String(v ?? '').trim();
  if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, '');
  return s;
}

/** Convertit une date (numéro de série Excel, ISO ou jj/mm/aaaa) en numéro de jour (série Excel). */
function toSerial(v) {
  if (v === '' || v == null) return 0;
  const n = Number(v);
  if (Number.isFinite(n)) return n;
  let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v);
  if (m) return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(1899, 11, 30)) / 864e5);
  m = /^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/.exec(v);
  if (m) return Math.round((Date.UTC(+m[3], +m[2] - 1, +m[1]) - Date.UTC(1899, 11, 30)) / 864e5);
  return 0;
}

/** Associe les en-têtes du fichier aux champs internes. */
function mapHeader(headers) {
  const low = headers.map(h => String(h ?? '').trim().toLowerCase());
  const pos = {};
  for (const [k, names] of Object.entries(GL_FIELDS)) {
    const i = low.findIndex(h => names.some(n => n.toLowerCase() === h));
    if (i >= 0) pos[k] = i;
  }
  return pos;
}

function headerOk(pos) {
  return pos.y !== undefined && pos.m !== undefined &&
    (pos.mt !== undefined || (pos.deb !== undefined && pos.cred !== undefined)) &&
    (pos.acc !== undefined || pos.sss !== undefined || pos.ss !== undefined);
}

const STRUCTURE = 'rubrique (sans écriture)';

/** Ajoute une ligne (tableau de valeurs brutes indexé par position) au stockage. */
function pushRow(L, pos, v) {
  const g = k => (pos[k] === undefined ? '' : (v[pos[k]] ?? ''));
  if (pos.type !== undefined && String(g('type')).trim().toLowerCase() === STRUCTURE) return;

  const mt = pos.mt !== undefined ? toNum(g('mt')) : deb - cred;

  L.soc.push(P.soc.id(String(g('soc')).trim()));
  L.y.push(y); L.m.push(m);
  L.acc.push(P.acc.id(acc));
  L.jr.push(P.jr.id(String(g('jr')).trim()));
  L.tiers.push(P.tiers.id(tiers));
  L.lib.push(P.lib.id(String(g('lib')).trim()));
  L.pc.push(P.pc.id(String(g('pc')).trim()));
  L.bnb.push(P.bnb.id(String(g('bnb')).trim()));
  L.cat.push(P.cat.id(String(g('cat')).trim()));
  L.nat.push(P.nat.id(String(g('nat')).trim()));
  L.dept.push(P.dept.id(String(g('dept')).trim()));
  L.serv.push(P.serv.id(String(g('serv')).trim()));
  L.date.push(toSerial(g('date')));
  L.deb.push(deb); L.cred.push(cred); L.mt.push(mt);

  for (let k = 0; k < count; k++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    let csize = dv.getUint32(off + 20, true), usize = dv.getUint32(off + 24, true);
    const nl = dv.getUint16(off + 28, true), xl = dv.getUint16(off + 30, true), cl = dv.getUint16(off + 32, true);
    let lho = dv.getUint32(off + 42, true);

    let p = off + 46 + nl; const end = p + xl;

      if (id === 1) {

        if (csize === 0xffffffff) { csize = Number(dv.getBigUint64(q, true)); q += 8; }
        if (lho === 0xffffffff) { lho = Number(dv.getBigUint64(q, true)); }

function entryData(buf, e) {

    await writer.close();

  pump.catch(() => {});

  try {
    for (;;) { const { done, value } = await reader.read(); if (done) break; yield value; }

    auto = ci + 1;

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }

})();
function crc32(crc, bytes) {
  let c = crc ^ 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

    const nameB = new TextEncoder().encode(name), start = this.offset;
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0808, true); // bit 3 : descripteur ; bit 11 : UTF-8
    h.setUint16(8, 8, true); h.setUint16(26, nameB.length, true);
    this._push(new Uint8Array(h.buffer)); this._push(nameB);
    const cs = new CompressionStream('deflate-raw'); const w = cs.writable.getWriter(); const r = cs.readable.getReader();
    let crc = 0, usize = 0, csize = 0;
    const reading = (async () => { for (;;) { const { done, value } = await r.read(); if (done) break; csize += value.length; this._push(value); } })();
    const enc = new TextEncoder();
    for await (const chunk of gen) {
      const b = enc.encode(chunk); crc = crc32(crc, b); usize += b.length; await w.write(b);
    }
    await w.close(); await reading;
    const dd = new DataView(new ArrayBuffer(16));
    dd.setUint32(0, 0x08074b50, true); dd.setUint32(4, crc, true); dd.setUint32(8, csize, true); dd.setUint32(12, usize, true);
    this._push(new Uint8Array(dd.buffer));
    this.central.push({ nameB, crc, csize, usize, start });
  }
  finish() {
    const cdStart = this.offset;
    for (const e of this.central) {
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0808, true);
      c.setUint16(10, 8, true); c.setUint32(16, e.crc, true); c.setUint32(20, e.csize, true); c.setUint32(24, e.usize, true);
      c.setUint16(28, e.nameB.length, true); c.setUint32(42, e.start, true);
      this._push(new Uint8Array(c.buffer)); this._push(e.nameB);
    }
    const end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true); end.setUint16(8, this.central.length, true); end.setUint16(10, this.central.length, true);
    end.setUint32(12, this.offset - cdStart, true); end.setUint32(16, cdStart, true);
    this._push(new Uint8Array(end.buffer));
    return new Blob(this.parts, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  }
}

/* --------------------------------------------- enrichissements du GL Analyzer -- */
const ES = EXPORT_SPEC;
function exRubrique(acc) {
  for (const [p, l, c, n] of ES.prefixes) if (acc.startsWith(p)) return [l, c, n];
  return ES.nonClasse;
}
function exMappingForecast(acc) {
  const c = String(acc).replace(/\D/g, '');
  if (c.length >= 3 && ES.mf3[c.slice(0, 3)]) return ES.mf3[c.slice(0, 3)];
  if (c.length >= 2 && ES.mf2[c.slice(0, 2)]) return ES.mf2[c.slice(0, 2)];
  return ES.mfNon;
}
function exBnb(acc) {
  const p2 = acc.slice(0, 2);
  if (ES.bnbExc[p2]) return ES.bnb3[acc.slice(0, 3)] || ES.bnbExc[p2];
  return ES.bnb2[p2] || '';
}

/* --------------------------------------------------------------- xlsx -- */
const xesc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
function colName(i) { let s = ''; i++; while (i) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
const COLS = ES.schema.map((_, i) => colName(i));
const IDX = Object.fromEntries(ES.schema.map((c, i) => [c, i]));
const NUMERIC = new Set(ES.numeric), DATES = new Set(ES.dates);

function cellXml(ci, r, v) {
  const name = ES.schema[ci], ref = COLS[ci] + r;
  if (v === null || v === undefined || v === '') return '';
  if (DATES.has(name)) return `<c r="${ref}" s="1"><v>${v}</v></c>`;
  if (NUMERIC.has(name)) return `<c r="${ref}"><v>${Math.round(v * 100) / 100}</v></c>`;
  return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(v)}</t></is></c>`;
}

/** Lignes de l'export (tableaux de valeurs dans l'ordre du schéma), triées comme le GL Analyzer. */
function exportRows(M, societe) {
  const L = M.L, P = L.pools, out = [];
  const socName = i => P.soc.list[L.soc[i]] || societe;
  const rank = s => { const k = ES.ordreScenarios.indexOf(s); return k < 0 ? ES.ordreScenarios.length : k; };
  const scen = P.sc.list.map((s, id) => ({ s, id })).sort((a, b) => rank(a.s) - rank(b.s));
  for (const { s, id } of scen) {
    const idx = []; for (let i = 0; i < L.n; i++) if (L.sc[i] === id) idx.push(i);
    if (!idx.length) continue;
    // Solde : cumul par compte, dans l'ordre du fichier (comme normalize_gl)
    const run = new Map(), solde = new Float64Array(idx.length);
    idx.forEach((i, k) => { const a = L.acc[i]; const v = (run.get(a) || 0) + L.mt[i]; run.set(a, v); solde[k] = v; });
    const rows = idx.map((i, k) => {
      const acc = P.acc.list[L.acc[i]], [rub, cat, nat] = exRubrique(acc), y = L.y[i], m = L.m[i];
      const date = L.date[i] || Math.round((Date.UTC(y, m - 1, 1) - Date.UTC(1899, 11, 30)) / 864e5);
      const tiers = P.tiers.list[L.tiers[i]];
      const v = new Array(ES.schema.length).fill('');
      Object.assign(v, {
        [IDX.Scenario]: s, [IDX.Societe]: socName(i), [IDX.Rubrique]: rub, [IDX.Categorie]: cat,
        [IDX.Mapping_Forecast]: exMappingForecast(acc), [IDX.Nature]: nat, [IDX.Rubrique_BNB]: exBnb(acc),
        [IDX.Services]: P.serv.list[L.serv[i]], [IDX.Tiers]: tiers, [IDX.Departement]: P.dept.list[L.dept[i]],
        [IDX.STD_Date]: date, [IDX.STD_Annee]: y, [IDX.STD_Mois]: m, [IDX.STD_Mois_Nom]: ES.mois[m] || '',
        [IDX.STD_Trimestre]: 'T' + (Math.floor((m - 1) / 3) + 1), [IDX.STD_Compte]: acc, [IDX.STD_Classe]: acc[0],
        [IDX.STD_Classe_Libelle]: ES.classes[acc[0]] || '', [IDX.STD_Sous_Classe]: acc.slice(0, 2), [IDX.STD_Sous_sous_Classe]: acc.slice(0, 3),
        [IDX.STD_Debit]: L.deb[i], [IDX.STD_Credit]: L.cred[i], [IDX.STD_Montant]: L.mt[i], [IDX.STD_Montant_inverse]: -L.mt[i],
        [IDX.STD_Sens]: L.mt[i] >= 0 ? 'D' : 'C', [IDX.STD_Solde]: solde[k], [IDX.STD_Libelle]: P.lib.list[L.lib[i]],
        [IDX.STD_Tiers]: tiers, [IDX.STD_Journal]: P.jr.list[L.jr[i]], [IDX.STD_Piece]: P.pc.list[L.pc[i]],
        [IDX.Type_Ligne]: ES.typeEcriture,
      });
      return v;
    });
    // lignes de structure : une ligne à zéro par rubrique et par période du scénario
    const periods = [...new Set(idx.map(i => L.y[i] * 100 + L.m[i]))].sort((a, b) => a - b);
    const soc0 = socName(idx[0]);
    for (const [code, rub, cat, nat, mf, bnb] of ES.structure) for (const p of periods) {
      const y = Math.floor(p / 100), m = p % 100, v = new Array(ES.schema.length).fill('');
      Object.assign(v, {
        [IDX.Scenario]: s, [IDX.Societe]: soc0, [IDX.Rubrique]: rub, [IDX.Categorie]: cat, [IDX.Mapping_Forecast]: mf,
        [IDX.Nature]: nat, [IDX.Rubrique_BNB]: bnb, [IDX.STD_Date]: Math.round((Date.UTC(y, m - 1, 1) - Date.UTC(1899, 11, 30)) / 864e5),
        [IDX.STD_Annee]: y, [IDX.STD_Mois]: m, [IDX.STD_Mois_Nom]: ES.mois[m] || '', [IDX.STD_Trimestre]: 'T' + (Math.floor((m - 1) / 3) + 1),
        [IDX.STD_Compte]: code, [IDX.STD_Classe]: code[0], [IDX.STD_Classe_Libelle]: ES.classes[code[0]] || '',
        [IDX.STD_Sous_Classe]: code.slice(0, 2), [IDX.STD_Sous_sous_Classe]: code.slice(0, 3),
        [IDX.STD_Debit]: 0, [IDX.STD_Credit]: 0, [IDX.STD_Montant]: 0, [IDX.STD_Montant_inverse]: 0, [IDX.STD_Solde]: 0,
        [IDX.Type_Ligne]: ES.typeStructure,
      });
      rows.push(v);
    }
    // tri stable (année, mois, compte) : écritures puis structure à clé égale
    const ord = rows.map((r, k) => k);
    ord.sort((a, b) => rows[a][IDX.STD_Annee] - rows[b][IDX.STD_Annee] || rows[a][IDX.STD_Mois] - rows[b][IDX.STD_Mois]
      || (rows[a][IDX.STD_Compte] < rows[b][IDX.STD_Compte] ? -1 : rows[a][IDX.STD_Compte] > rows[b][IDX.STD_Compte] ? 1 : a - b));
    for (const k of ord) out.push(rows[k]);
  }
  return out;
}

async function buildExportXlsx(M, societe, onProgress) {
  const rows = exportRows(M, societe);
  const z = new ZipWriter();
  const one = s => (async function* () { yield s; })();

  await z.add('_rels/.rels', one('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'));
  await z.add('xl/workbook.xml', one(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${ES.sheet}" sheetId="1" r:id="rId1"/></sheets></workbook>`));
  await z.add('xl/_rels/workbook.xml.rels', one('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'));
  await z.add('xl/styles.xml', one('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="yyyy-mm-dd"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'));
  const n = rows.length;
  await z.add('xl/worksheets/sheet1.xml', (async function* () {
    yield `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:${COLS[COLS.length - 1]}${n + 1}"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="${IDX.STD_Date + 1}" max="${IDX.STD_Date + 1}" width="12" customWidth="1"/></cols><sheetData>`;
    yield '<row r="1">' + ES.schema.map((h, j) => `<c r="${COLS[j]}1" s="2" t="inlineStr"><is><t>${xesc(h)}</t></is></c>`).join('') + '</row>';
    let buf = '';
    for (let k = 0; k < n; k++) {
      const r = k + 2, v = rows[k];
      let s = `<row r="${r}">`;
      for (let j = 0; j < v.length; j++) s += cellXml(j, r, v[j]);
      buf += s + '</row>';
      if (buf.length > 1 << 20) { yield buf; buf = ''; if (onProgress) onProgress(k / n); }
    }
    yield buf + `</sheetData><autoFilter ref="A1:${COLS[COLS.length - 1]}${n + 1}"/></worksheet>`;
  })());
  return { blob: z.finish(), rows: n };
}

const ALL_PREFIXES = [...new Set([...PL.flatMap(x => x.p || []), ...BS.flatMap(x => x.p || []),

class Model {
  constructor(parsed) {
    this.L = parsed.lines; this.source = parsed.source; this.columns = parsed.columns;
    const P = this.L.pools;
    this.scenarios = P.sc.list.slice();
    this.companies = P.soc.list.filter(Boolean);
    this.accs = P.acc.list;
    this.soc = null;           // filtre société (null = toutes)
    this.opening = this.detectOpening();
    this.build();
  }

  /** Journal d'ouverture : codes usuels, sinon le journal dont toutes les lignes sont en janvier et touchent la classe 1. */
  detectOpening() {
    const L = this.L, jr = L.pools.jr.list;
    const named = jr.find(j => /^(REO|OUV|OUVERTURE|RAN|AN|OPEN|OPENING|BAL)$/i.test(j));
    if (named) return named;
    const st = jr.map(() => ({ n: 0, jan: 0, c1: 0 }));
    for (let i = 0; i < L.n; i++) {
      const s = st[L.jr[i]]; s.n++;
      if (L.m[i] === 1) s.jan++;
      if (this.accs[L.acc[i]][0] === '1') s.c1++;
    }
    let best = '', bn = 0;
    st.forEach((s, j) => { if (jr[j] && s.n > 5 && s.jan === s.n && s.c1 > 0 && s.n > bn) { best = jr[j]; bn = s.n; } });
    return best;
  }

  setOpening(j) { this.opening = j; this.build(); }
  setCompany(c) { this.soc = c || null; this.build(); }

  build() {
    const L = this.L, P = L.pools;
    const opId = this.opening ? P.jr.map.get(this.opening) : -1;
    const socId = this.soc ? P.soc.map.get(this.soc) : -1;
    this.cells = new Map(); this.tiers = new Map(); this.bnbIdx = new Map();
    this.months = new Map(); this.years = new Map(); this.cache = new Map();
    const c40 = new Set(), c44 = new Set();
    this.accs.forEach((a, i) => { if (a.startsWith('40')) c40.add(i); else if (a.startsWith('44')) c44.add(i); });
    for (let i = 0; i < L.n; i++) {
      if (socId >= 0 && L.soc[i] !== socId) continue;
      const sc = L.sc[i], y = L.y[i];
      const key = sc + '|' + y;
      let mp = this.cells.get(key);
      if (!mp) {
        mp = new Map(); this.cells.set(key, mp);
        this.months.set(key, new Set());
        if (!this.years.has(sc)) this.years.set(sc, new Set());
        this.years.get(sc).add(y);
      }
      const isOpen = L.jr[i] === opId;
      const slot = isOpen ? 0 : L.m[i];
      if (!isOpen) this.months.get(key).add(L.m[i]);
      let arr = mp.get(L.acc[i]);
      if (!arr) { arr = new Float64Array(13); mp.set(L.acc[i], arr); }
      arr[slot] += L.mt[i];
      // tiers clients / fournisseurs
      const a = L.acc[i];
      if ((c40.has(a) || c44.has(a)) && L.tiers[i] !== undefined) {
        let tm = this.tiers.get(key); if (!tm) { tm = new Map(); this.tiers.set(key, tm); }
        const tk = (c40.has(a) ? 'C' : 'F') + L.tiers[i];
        let t = tm.get(tk);
        if (!t) { t = { deb: new Float64Array(13), cred: new Float64Array(13) }; tm.set(tk, t); }
        t.deb[slot] += L.deb[i]; t.cred[slot] += L.cred[i];
      }
      // rubriques BNB
      let bm = this.bnbIdx.get(key); if (!bm) { bm = new Map(); this.bnbIdx.set(key, bm); }
      const bk = L.bnb[i];
      let b = bm.get(bk);
      if (!b) { b = { v: new Float64Array(13), minAcc: this.accs[a], cat: P.cat.list[L.cat[i]], nat: P.nat.list[L.nat[i]] }; bm.set(bk, b); }
      b.v[slot] += L.mt[i];
      if (this.accs[a] < b.minAcc) b.minAcc = this.accs[a];
    }
  }

  yearsOf(sc) { return [...(this.years.get(this.scenarios.indexOf(sc)) || [])].sort((a, b) => a - b); }
  monthsOf(sc, y) { return [...(this.months.get(this.scenarios.indexOf(sc) + '|' + y) || [])].sort((a, b) => a - b); }
  lastMonth(sc, y) { const m = this.monthsOf(sc, y); return m.length ? m[m.length - 1] : 0; }
  hasScenario(sc) { return this.scenarios.includes(sc) && this.yearsOf(sc).length > 0; }

  matching(prefs) {
    const key = prefs.join(',');
    let r = this.cache.get(key);
    if (!r) { r = []; this.accs.forEach((a, i) => { if (prefs.some(p => a.startsWith(p))) r.push(i); }); this.cache.set(key, r); }
    return r;
  }

  /** Somme des montants (débit − crédit) des comptes commençant par un des préfixes. */
  net(sc, y, prefs, from = 1, to = 12, open = false) {
    const mp = this.cells.get(this.scenarios.indexOf(sc) + '|' + y);
    if (!mp) return 0;
    let s = 0;
    for (const a of this.matching(prefs)) {
      const arr = mp.get(a); if (!arr) continue;
      if (open) s += arr[0];
      for (let m = from; m <= to; m++) s += arr[m];
    }
    return s;
  }
  flow(sc, y, prefs, from, to) { return this.net(sc, y, prefs, from, to, false); }
  bal(sc, y, prefs, to) { return this.net(sc, y, prefs, 1, to, true); }

  /** Valeurs des lignes du P&L (produit +, charge −) sur les mois [from, to]. */
  pl(sc, y, from = 1, to = 12) {
    const v = {};
    for (const x of PL) if (x.p) v[x.k] = -this.flow(sc, y, x.p, from, to);
    v.prod = v.ca + v.p71 + v.p72 + v.p73 + v.p74 + v.p76;
    v.chg = v.c60 + v.c61 + v.c62 + v.c63 + v.c64 + v.c66;
    v.ebit = v.prod + v.chg;
    v.da = -this.flow(sc, y, ['630', '631', '632', '633', '634'], from, to); // dotations (négatif)
    v.ebitda = v.ebit - v.da;
    v.ebitdaCourant = v.ebitda - v.p76 - v.c66;
    v.fin = v.p75 + v.c65;
    v.ebt = v.ebit + v.fin;
    v.rn = v.ebt + v.c67 + v.p77 + v.c68;
    v.nonAffecte = -this.flow(sc, y, ['6', '7'], from, to); // y compris 69/79 et 689/789
    return v;
  }

  /** Bilan à la fin du mois `to` (ouverture + mouvements de l'exercice). */
  bs(sc, y, to = 12) {
    const v = {};
    for (const x of BS) {
      if (x.p) v[x.k] = (x.s === 'P' ? -1 : 1) * this.bal(sc, y, x.p, to);
    }
    v.pRes = -this.flow(sc, y, ['6', '7'], 1, to) - this.net(sc, y, ['6', '7'], 1, 0, true);
    const sum = g => BS.filter(x => x.g === g).reduce((s, x) => s + (v[x.k] || 0), 0);
    v.immo = sum('immo'); v.circ = sum('circ'); v.actif = v.immo + v.circ;
    v.cp = sum('cp'); v.prov = sum('prov'); v.det = sum('det');
    v.passif = v.cp + v.prov + v.det;
    v.ecart = v.actif - v.passif;
    v.treso = v.a50 + v.a54;
    v.dettesFin = v.p17 + v.p42 + v.p43;
    return v;
  }

  /** Tableau des flux de trésorerie (méthode indirecte) sur [from, to] — réconcilié par construction. */
  cf(sc, y, from, to) {
    const f = p => this.flow(sc, y, p, from, to);
    const pl = this.pl(sc, y, from, to);
    const r = {};
    r.rn = pl.rn;
    r.amort = f(['630', '660', '661', '760', '761']);
    r.dStocks = -f(['3']); r.dClients = -f(['40']); r.dAutresCreances = -f(['41', '29']);
    r.dRegul = -f(['49']); r.dProv = -f(['16']);
    r.dFourn = -f(['44']); r.dFiscSoc = -f(['45']); r.dAcomptes = -f(['46']); r.dAutresDettes = -f(['48']);
    r.bfr = r.dStocks + r.dClients + r.dAutresCreances + r.dRegul + r.dProv + r.dFourn + r.dFiscSoc + r.dAcomptes + r.dAutresDettes;
    r.cfo = r.rn + r.amort + r.bfr;
    r.capex = -(f(['20', '21', '22', '23', '24', '25', '26', '27']) + r.amort);
    r.dImmoFin = -f(['28']);
    r.cfi = r.capex + r.dImmoFin;
    r.dFP = -f(['10', '11', '12', '13', '14', '15']);
    r.dDettesFin = -f(['17', '42', '43']);
    r.dDividendes = -f(['47']);
    r.affect = -f(['69', '79', '689', '789']);
    r.cff = r.dFP + r.dDettesFin + r.dDividendes + r.affect;
    r.var = r.cfo + r.cfi + r.cff;
    r.dTreso = f(['5']);
    r.ecart = r.var - r.dTreso;
    return r;
  }

  /** États « à la GL Analyzer » (gl_core/ratios.build_statements) sur l'exercice jusqu'au mois `to`. */
  statements(sc, y, to = 12) {
    const fl = p => this.flow(sc, y, p, 1, to), bl = p => this.bal(sc, y, p, to);
    const s = {};
    s.chiffre_affaires = -fl(acc('chiffre_affaires'));
    s.produits_exploitation = -fl(acc('chiffre_affaires', 'production_stockee', 'production_immobilisee', 'cotisations_subsides', 'autres_produits_expl'));
    s.achats = fl(acc('achats')); s.services_biens_divers = fl(acc('services_biens_divers'));
    s.remunerations = fl(acc('remunerations')); s.remuneration_dirigeant = fl(acc('remuneration_dirigeant'));
    s.amortissements = fl(acc('amortissements', 'reductions_valeur'));
    s.charges_exploitation = fl(['60', '61', '62', '63', '64']);
    s.ebit = s.produits_exploitation - s.charges_exploitation;
    s.ebitda = s.ebit + s.amortissements;
    s.charges_interets = fl(acc('charges_interets'));
    const pl = this.pl(sc, y, 1, to); s.resultat_net = pl.rn;
    s.actif_immobilise = bl(acc('frais_etablissement', 'immo_incorporelles', 'immo_corporelles', 'immo_financieres'));
    s.stocks = bl(acc('stocks')); s.clients = bl(acc('clients')); s.autres_creances = bl(acc('autres_creances'));
    s.tresorerie = bl(acc('placements_tresorerie', 'valeurs_disponibles'));
    s.actifs_circulants = s.stocks + s.clients + s.autres_creances + s.tresorerie;
    const b = this.bs(sc, y, to);
    s.total_actif = b.actif; s.capitaux_propres = b.cp; s.provisions = b.prov;
    s.dettes_financieres_lt = b.p17; s.dettes_financieres_ct = b.p42 + b.p43;
    s.dettes_financieres = s.dettes_financieres_lt + s.dettes_financieres_ct;
    s.fournisseurs = b.p44;
    s.dettes_court_terme = b.p42 + b.p43 + b.p44 + b.p45 + b.p46 + b.p47;
    s.dettes_totales = s.dettes_court_terme + b.p17;
    s.dette_nette = s.dettes_financieres - s.tresorerie;
    s.total_passif = b.passif;
    s.capitaux_permanents = s.capitaux_propres + s.provisions + s.dettes_financieres_lt;
    s.fonds_roulement = s.capitaux_permanents - s.actif_immobilise;
    s.tresorerie_nette = s.tresorerie - s.dettes_financieres_ct;
    s.bfr = s.fonds_roulement - s.tresorerie_nette;
    s.jours = Math.round(365 * to / 12);
    return s;
  }

  ratios(sc, y, to = 12) {
    const s = this.statements(sc, y, to), q = (a, b) => (b ? a / b : NaN), d = s.jours;
    return {
      'Rentabilité': {
        'Marge EBITDA': [q(s.ebitda, s.chiffre_affaires), '%'],
        "Marge d'exploitation (EBIT)": [q(s.ebit, s.chiffre_affaires), '%'],
        'Marge nette': [q(s.resultat_net, s.chiffre_affaires), '%'],
        'ROE (rentabilité fonds propres)': [q(s.resultat_net, s.capitaux_propres), '%'],
        "ROA (rentabilité de l'actif)": [q(s.resultat_net, s.total_actif), '%'],
        'ROCE': [q(s.ebit, s.capitaux_propres + s.dettes_financieres), '%'],
      },
      'Liquidité': {
        'Liquidité générale (current)': [q(s.actifs_circulants, s.dettes_court_terme), 'x'],
        'Liquidité réduite (quick)': [q(s.actifs_circulants - s.stocks, s.dettes_court_terme), 'x'],
        'Fonds de roulement (FR)': [s.fonds_roulement, '€'],
        'Besoin en FR (BFR)': [s.bfr, '€'],
        'Trésorerie nette (TN)': [s.tresorerie_nette, '€'],
      },
      'Solvabilité & endettement': {
        'Solvabilité (indépendance financière)': [q(s.capitaux_propres, s.total_passif), '%'],
        'Gearing (dette nette / FP)': [q(s.dette_nette, s.capitaux_propres), 'x'],
        'Dette nette / EBITDA': [q(s.dette_nette, s.ebitda * 12 / Math.max(1, to)), 'x'],
        'Couverture des intérêts': [q(s.ebit, s.charges_interets), 'x'],
        'Endettement total / total bilan': [q(s.dettes_totales, s.total_passif), '%'],
      },
      "Cycle d'exploitation": {
        'DSO (jours clients)': [q(s.clients, s.chiffre_affaires * TVA) * d, 'j'],
        'DPO (jours fournisseurs)': [q(s.fournisseurs, (s.achats + s.services_biens_divers + s.remuneration_dirigeant) * TVA) * d, 'j'],
        'DIO (jours de stock)': [q(s.stocks, s.achats) * d, 'j'],
        'Cycle de conversion (CCC)': [(q(s.clients, s.chiffre_affaires * TVA) + q(s.stocks, s.achats)
          - q(s.fournisseurs, (s.achats + s.services_biens_divers + s.remuneration_dirigeant) * TVA)) * d, 'j'],
      },
    };
  }

  /** Top clients (40) et fournisseurs (44) : facturé, réglé, solde. */
  topTiers(sc, y, to = 12) {
    const tm = this.tiers.get(this.scenarios.indexOf(sc) + '|' + y);
    const names = this.L.pools.tiers.list;
    const C = [], F = [];
    if (tm) for (const [k, t] of tm) {
      const nm = names[+k.slice(1)] || '(sans tiers)';
      let deb = 0, cred = 0; for (let m = 1; m <= to; m++) { deb += t.deb[m]; cred += t.cred[m]; }
      const solde = t.deb[0] - t.cred[0] + deb - cred;
      if (k[0] === 'C') C.push({ nom: nm, facture: deb, regle: cred, solde });
      else F.push({ nom: nm, facture: cred, regle: deb, solde: -solde });
    }
    C.sort((a, b) => b.facture - a.facture); F.sort((a, b) => b.facture - a.facture);
    return { clients: C, fournisseurs: F };
  }

  /** Lignes BNB (colonne Rubrique_BNB de l'export). */
  bnb(sc, y, to = 12) {
    const bm = this.bnbIdx.get(this.scenarios.indexOf(sc) + '|' + y);
    const names = this.L.pools.bnb.list; const out = [];
    if (bm) for (const [k, b] of bm) {
      if (!names[k]) continue;
      const isBil = /bilan/i.test(b.cat) || /^[1-5]/.test(b.minAcc);
      let v = 0; if (isBil) v += b.v[0]; for (let m = 1; m <= to; m++) v += b.v[m];
      out.push({ nom: names[k], minAcc: b.minAcc, cat: isBil ? 'Bilan' : (/affect/i.test(b.cat) ? 'Affectation' : 'Résultat'), nat: b.nat, v });
    }
    return out.sort((a, b) => a.minAcc.localeCompare(b.minAcc));
  }

  unmappedAccounts() {
    const out = [];
    this.accs.forEach((a, i) => {
      if (!ALL_PREFIXES.some(p => a.startsWith(p)) && !/^[67]/.test(a)) out.push(a);
    });
    return out;
  }
}

if (typeof module !== 'undefined') module.exports = { Model, PL, BS, MAPPING, MOIS, MOIS_C, TVA };

/* ==========================================================================
   finance.js — Hypothèses (6a), projection annuelle 3 états (6b),
   retraitements (7a) et valorisation (7b)
   --------------------------------------------------------------------------
   Reprend la logique du tableau de bord Excel, en annuel. Le BFR est projeté
   sur des jours de CA / d'achats ANNUELS (même base que les ratios), ce qui
   évite le saut artificiel de la 1re année projetée.
   ========================================================================== */
'use strict';

const IMMO_CATS = [
  ['a20', "Frais d'établissement", 5], ['a21', 'Immobilisations incorporelles', 5],
  ['a22', 'Terrains et constructions', 20], ['a23', 'Installations, machines et outillage', 5],
  ['a24', 'Mobilier et matériel roulant', 5], ['a25', 'Location-financement', 5],
  ['a26', 'Autres immobilisations corporelles', 5], ['a27', 'Immobilisations en cours', 0],
];
const HORIZON = 7;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const fill = (n, v) => Array.from({ length: n }, () => v);

/** Dernier exercice réel complet (mois 12 présent). */
function baseYear(M) {
  const ys = M.yearsOf('Actuals').filter(y => M.lastMonth('Actuals', y) === 12);
  return ys.length ? ys[ys.length - 1] : M.yearsOf('Actuals').slice(-1)[0];
}

/** Hypothèses par défaut, déduites des comptes du dernier exercice. */
function defaultHyp(M, B) {
  B = B || baseYear(M);
  const pl = M.pl('Actuals', B), plP = M.pl('Actuals', B - 1), bs = M.bs('Actuals', B, 12);
  const g = (a, b, d) => (b && Number.isFinite(a / b) ? a / b - 1 : d);
  const ca = pl.ca || 1;
  const n = HORIZON;
  const amort630 = M.flow('Actuals', B, ['630'], 1, 12);
  const nbv = IMMO_CATS.map(([k]) => Math.max(0, bs[k]));
  const tot = nbv.reduce((s, x) => s + x, 0) || 1;
  const capex = {}, duree = {};
  IMMO_CATS.forEach(([k, , d], i) => {
    capex[k] = fill(n, Math.round(Math.max(0, amort630) * nbv[i] / tot / 1000) * 1000);
    duree[k] = d;
  });
  const achatsTTC = (-pl.c60 - pl.c61) * 1.21;
  return {
    base: B, years: Array.from({ length: n }, (_, i) => B + 1 + i), tva: 1.21,
    gCA: fill(n, +clamp(g(pl.ca, plP.ca, 0.02), -0.1, 0.15).toFixed(4)),
    g74: fill(n, 0), g76: fill(n, 0),
    r60: fill(n, +(-pl.c60 / ca).toFixed(4)), r61: fill(n, +(-pl.c61 / ca).toFixed(4)),
    r64: fill(n, +(-pl.c64 / ca).toFixed(4)), c66: fill(n, 0),
    gPers: fill(n, +clamp(g(pl.c62, plP.c62, 0.02), 0, 0.1).toFixed(4)),
    p75: fill(n, Math.round(pl.p75)), c65: fill(n, Math.round(-pl.c65)),
    isoc: fill(n, 0.25), reportPertes: false,
    dso: fill(n, +(bs.a40 / (ca * 1.21) * 365 || 0).toFixed(1)),
    dpo: fill(n, +(achatsTTC ? bs.p44 / achatsTTC * 365 : 0).toFixed(1)),
    moisSoc: fill(n, +(pl.c62 ? bs.p45 / (-pl.c62 / 12) : 0).toFixed(2)),
    tauxDecouvert: fill(n, 0),
    capital: fill(n, 0), dividendes: fill(n, 0), emprunt: fill(n, 0), rembours: fill(n, 0),
    capex, duree,
  };
}

/** Projection annuelle : P&L, bilan, flux. Renvoie [réel B, B+1, …]. */
function project(M, H) {
  const B = H.base, n = H.years.length;
  const pl0 = M.pl('Actuals', B), bs0 = M.bs('Actuals', B, 12), cf0 = M.cf('Actuals', B, 1, 12);
  const out = [{ y: B, actual: true, pl: pl0, bs: bs0, cf: cf0 }];
  const amort630 = M.flow('Actuals', B, ['630'], 1, 12);
  const nbv0 = IMMO_CATS.map(([k]) => Math.max(0, bs0[k]));
  const tot = nbv0.reduce((s, x) => s + x, 0) || 1;
  const existRate = nbv0.map(x => Math.max(0, amort630) * x / tot);
  const existLeft = nbv0.slice();
  let pool = 0; // pertes fiscales reportables
  for (let t = 0; t < n; t++) {
    const pv = out[t], P = pv.pl, S = pv.bs;
    const pl = {}, bs = {};
    pl.ca = P.ca * (1 + H.gCA[t]);
    pl.p71 = P.p71; pl.p72 = P.p72; pl.p73 = P.p73;
    pl.p74 = P.p74 * (1 + H.g74[t]); pl.p76 = P.p76 * (1 + H.g76[t]);
    pl.prod = pl.ca + pl.p71 + pl.p72 + pl.p73 + pl.p74 + pl.p76;
    pl.c60 = -H.r60[t] * pl.ca; pl.c61 = -H.r61[t] * pl.ca; pl.c64 = -H.r64[t] * pl.ca;
    pl.c62 = P.c62 * (1 + H.gPers[t]); pl.c66 = -H.c66[t];
    // amortissements : existants (rythme de l'exercice de base, jusqu'à épuisement) + nouveaux investissements
    let am = 0; const amCat = {};
    IMMO_CATS.forEach(([k], i) => {
      const e = Math.min(existLeft[i], existRate[i]); existLeft[i] -= e;
      let nw = 0; const d = +H.duree[k] || 0;
      if (d > 0) for (let s = 0; s <= t; s++) if (t - s < d) nw += (+H.capex[k][s] || 0) / d;
      amCat[k] = e + nw; am += e + nw;
    });
    pl.c63 = -am; pl.da = -am;
    pl.chg = pl.c60 + pl.c61 + pl.c62 + pl.c63 + pl.c64 + pl.c66;
    pl.ebit = pl.prod + pl.chg; pl.ebitda = pl.ebit + am; pl.ebitdaCourant = pl.ebitda - pl.p76 - pl.c66;
    pl.p75 = +H.p75[t];
    pl.c65 = -H.c65[t] - H.tauxDecouvert[t] * Math.max(0, -S.treso);
    pl.fin = pl.p75 + pl.c65; pl.ebt = pl.ebit + pl.fin;
    let base = pl.ebt;
    if (H.reportPertes) {
      if (pl.ebt > 0) { const used = Math.min(pool, pl.ebt); base = pl.ebt - used; pool -= used; }
      else pool += -pl.ebt;
    }
    pl.c67 = -H.isoc[t] * Math.max(0, base); pl.p77 = 0; pl.c68 = 0;
    pl.rn = pl.ebt + pl.c67;
    // ---- bilan
    let capexT = 0;
    IMMO_CATS.forEach(([k]) => { const c = +H.capex[k][t] || 0; capexT += c; bs[k] = S[k] + c - amCat[k]; });
    for (const k of ['a28', 'a29', 'a3', 'a41', 'a50', 'a49', 'p11', 'p12', 'p13', 'p15', 'p16', 'p42', 'p43', 'p46', 'p47', 'p49']) bs[k] = S[k];
    bs.a40 = H.dso[t] * pl.ca * H.tva / 365;
    bs.p44 = H.dpo[t] * (-pl.c60 - pl.c61) * H.tva / 365;
    bs.p45 = H.moisSoc[t] * (-pl.c62) / 12;
    bs.p10 = S.p10 + (+H.capital[t] || 0);
    bs.p14 = S.p14 + S.pRes - (+H.dividendes[t] || 0);
    bs.pRes = pl.rn;
    bs.p17 = S.p17 + (+H.emprunt[t] || 0) - (+H.rembours[t] || 0);
    // ---- flux
    const cf = {};
    cf.rn = pl.rn; cf.amort = am;
    cf.dStocks = -(bs.a3 - S.a3); cf.dClients = -(bs.a40 - S.a40); cf.dAutresCreances = -(bs.a41 + bs.a29 - S.a41 - S.a29);
    cf.dRegul = -(bs.a49 - S.a49) + (bs.p49 - S.p49); cf.dProv = bs.p16 - S.p16;
    cf.dFourn = bs.p44 - S.p44; cf.dFiscSoc = bs.p45 - S.p45; cf.dAcomptes = bs.p46 - S.p46; cf.dAutresDettes = bs.p47 - S.p47;
    cf.bfr = cf.dStocks + cf.dClients + cf.dAutresCreances + cf.dRegul + cf.dProv + cf.dFourn + cf.dFiscSoc + cf.dAcomptes + cf.dAutresDettes;
    cf.cfo = cf.rn + cf.amort + cf.bfr;
    cf.capex = -capexT; cf.dImmoFin = 0; cf.cfi = cf.capex;
    cf.dFP = (+H.capital[t] || 0); cf.dDividendes = -(+H.dividendes[t] || 0);
    cf.dDettesFin = (+H.emprunt[t] || 0) - (+H.rembours[t] || 0); cf.affect = 0;
    cf.cff = cf.dFP + cf.dDividendes + cf.dDettesFin;
    cf.var = cf.cfo + cf.cfi + cf.cff;
    bs.a54 = S.a54 + cf.var;
    const sum = ks => ks.reduce((s, k) => s + (bs[k] || 0), 0);
    bs.immo = sum(['a20', 'a21', 'a22', 'a23', 'a24', 'a25', 'a26', 'a27', 'a28']);
    bs.circ = sum(['a29', 'a3', 'a40', 'a41', 'a50', 'a54', 'a49']);
    bs.actif = bs.immo + bs.circ;
    bs.cp = sum(['p10', 'p11', 'p12', 'p13', 'p14', 'pRes', 'p15']); bs.prov = bs.p16;
    bs.det = sum(['p17', 'p42', 'p43', 'p44', 'p45', 'p46', 'p47', 'p49']);
    bs.passif = bs.cp + bs.prov + bs.det; bs.ecart = bs.actif - bs.passif;
    bs.treso = bs.a50 + bs.a54; bs.dettesFin = bs.p17 + bs.p42 + bs.p43;
    cf.dTreso = bs.treso - S.treso; cf.ecart = cf.var - cf.dTreso;
    bs.bfrNiveau = bs.a3 + bs.a40 + bs.a41 + bs.a49 - bs.p44 - bs.p45 - bs.p46 - bs.p47 - bs.p49;
    out.push({ y: H.years[t], actual: false, pl, bs, cf });
  }
  out[0].bs.bfrNiveau = bs0.a3 + bs0.a40 + bs0.a41 + bs0.a49 - bs0.p44 - bs0.p45 - bs0.p46 - bs0.p47 - bs0.p49;
  return out;
}

function retraitements(M, H, R) {
  const B = H.base, Y = [B - 1, B], t = H.isoc[0];
  const amt = (k, y) => {
    const pl = M.pl('Actuals', y);
    switch (k) {
      case 'p76': return pl.p76;
      case 'c66': return pl.c66;
      case 's740': return -M.flow('Actuals', y, ['740'], 1, 12);
      case 'a741': return pl.p74 + M.flow('Actuals', y, ['740'], 1, 12);
      case 'r618': return -M.flow('Actuals', y, ['618'], 1, 12);
      case 'l610': return -M.flow('Actuals', y, ['610'], 1, 12);
      default: return 0;
    }
  };
  const rows = R.rows.map(r => {
    const a = r.free ? [+r.n1 || 0, +r.n || 0] : Y.map(y => amt(r.k, y));
    const adj = a.map(v => (r.ret ? -v - (r.norm !== undefined ? (+r.norm || 0) : 0) : 0));
    return { ...r, a, adj };
  });
  const ebitdaPub = Y.map(y => M.pl('Actuals', y).ebitda);
  const totAdj = [0, 1].map(i => rows.reduce((s, r) => s + r.adj[i], 0));
  const ebitdaNorm = [0, 1].map(i => ebitdaPub[i] + totAdj[i]);
  const caY = Y.map(y => M.pl('Actuals', y).ca);
  const ebitdaRef = R.choix === 'Moyenne 2 exercices' ? (ebitdaNorm[0] + ebitdaNorm[1]) / 2 : ebitdaNorm[1];
  const recurrent = rows.filter(r => r.rec && r.ret).reduce((s, r) => s + r.adj[1], 0);
  const rn = Y.map(y => M.pl('Actuals', y).rn);
  const rnNorm = [0, 1].map(i => rn[i] + totAdj[i] * (1 - t));
  // ---- bilan
  const bs = M.bs('Actuals', B, 12);
  const imp = -M.bal('Actuals', B, ['450', '452'], 12);
  const bil = R.bilan.map(r => {
    let e = 0, j = 0;
    switch (r.k) {
      case 'd17': e = bs.p17; j = Math.max(0, e); break;
      case 'd42': e = bs.p42; j = Math.max(0, e); break;
      case 'd43': e = bs.p43; j = Math.max(0, e); break;
      case 'tre': e = bs.treso; j = -e; break;
      case 'pro': e = bs.p16; j = e; break;
      case 'imp': e = imp; j = e; break;
      case 'div': e = bs.p47; j = e; break;
      case 'idf': e = bs.p15 * t; j = e; break;
      case 'ifi': e = bs.a28; j = -((+r.vm || 0) > 0 ? +r.vm : e); break;
      case 'aqd': e = +r.vm || 0; j = e; break;
      default: e = null; j = -(+r.vm || 0);
    }
    return { ...r, e, j: r.ret ? j : 0 };
  });
  const detteNette = bil.reduce((s, r) => s + r.j, 0);
  const detteComptable = Math.max(0, bs.p17) + Math.max(0, bs.p42) + Math.max(0, bs.p43) - bs.treso;
  return { Y, rows, ebitdaPub, totAdj, ebitdaNorm, caY, ebitdaRef, recurrent, rn, rnNorm, bil, detteNette, detteComptable,
    marge: [0, 1].map(i => (caY[i] ? ebitdaNorm[i] / caY[i] : 0)) };
}

/* ---------------------------------------------------------- Valorisation -- */
function defaultVal() {
  return {
    rf: 0.03, mrp: 0.055, size: 0.03, spec: 0.01, kd: 0.045, dShare: 0.2, g: 0.02, tvNorm: true,
    mult: { ebitda: [5, 6, 7], ca: [0.6, 0.8, 1.0], per: [7, 8, 9] },
    anc: { pv: 0, autres: 0, fourchette: 0.1 },
    poids: { dcf: 0.3, ebitda: 0.25, ca: 0.1, per: 0.25, anc: 0.1 },
    force: { dcf: '', ebitda: '', ca: '', per: '', anc: '' },
    dlom: 0.15, plancher: true,
  };
}

function valuation(M, H, R7, V, proj) {
  const t = H.isoc[0];
  const ke = V.rf + V.mrp + V.size + V.spec;
  const wacc = (1 - V.dShare) * ke + V.dShare * V.kd * (1 - t);
  const DN = R7.detteNette;
  const r76 = R7.rows.find(r => r.k === 'p76'), r66 = R7.rows.find(r => r.k === 'c66');
  const yrs = proj.slice(1, 6);
  const rows = yrs.map(p => {
    const ebitda = p.pl.ebitda - (r76.ret ? p.pl.p76 : 0) - (r66.ret ? p.pl.c66 : 0) + R7.recurrent;
    const da = p.pl.c63, ebit = ebitda + da, tax = -Math.max(0, ebit) * t;
    const capex = p.cf.capex, bfr = p.cf.bfr;
    return { y: p.y, ca: p.pl.ca, ebitda, da, ebit, tax, amort: -da, capex, bfr, fcf: ebit + tax - da + capex + bfr };
  });
  const L = rows[rows.length - 1], g = V.g;
  const tv = {};
  tv.ca = L.ca * (1 + g); tv.ebitda = L.ebitda * (1 + g);
  tv.da = V.tvNorm ? L.capex * (1 + g) : L.da * (1 + g);
  tv.capex = V.tvNorm ? tv.da : L.capex * (1 + g);
  tv.bfr = V.tvNorm ? -g * proj[5].bs.bfrNiveau : L.bfr * (1 + g);
  tv.ebit = tv.ebitda + tv.da; tv.tax = -Math.max(0, tv.ebit) * t; tv.amort = -tv.da;
  tv.fcf = tv.ebit + tv.tax - tv.da + tv.capex + tv.bfr;
  const dcfAt = (w, gg = g) => {
    let s = 0; rows.forEach((r, i) => { s += r.fcf / Math.pow(1 + w, i + 1); });
    const tvv = w > gg ? tv.fcf / (1 + g) * (1 + gg) / (w - gg) / Math.pow(1 + w, rows.length) : 0;
    return { pv: s, tvPv: tvv, ev: s + tvv, eq: s + tvv - DN };
  };
  const c = dcfAt(wacc);
  rows.forEach((r, i) => { r.df = 1 / Math.pow(1 + wacc, i + 1); r.pv = r.fcf * r.df; });
  const dcf = { rows, tv, tvValue: wacc > g ? tv.fcf / (wacc - g) : 0, ...c, tvWeight: c.ev ? c.tvPv / c.ev : 0,
    low: dcfAt(wacc + 0.01).eq, high: dcfAt(wacc - 0.01).eq, warn: wacc <= g };
  // agrégats N
  const plB = M.pl('Actuals', H.base), bsB = M.bs('Actuals', H.base, 12);
  const ag = { ca: plB.ca, ebitda: R7.ebitdaRef, ebit: R7.ebitdaRef + plB.da, rn: R7.rnNorm[1], cp: bsB.cp,
    dettesFin: Math.max(0, bsB.p17 + bsB.p42 + bsB.p43), treso: bsB.treso, dn: DN };
  const mult = (base, m, dn) => m.map(x => base * x - dn);
  const meth = [
    { k: 'dcf', l: 'DCF (WACC ± 1 pt)', v: [dcf.low, dcf.eq, dcf.high], base: null },
    { k: 'ebitda', l: "Multiple d'EBITDA", v: mult(ag.ebitda, V.mult.ebitda, DN), base: ag.ebitda },
    { k: 'ca', l: 'Multiple de CA', v: mult(ag.ca, V.mult.ca, DN), base: ag.ca },
    { k: 'per', l: 'PER', v: ag.rn > 0 ? V.mult.per.map(x => ag.rn * x) : [0, 0, 0], base: ag.rn },
    { k: 'anc', l: 'Actif net corrigé', v: null, base: null },
  ];
  const ancC = ag.cp + V.anc.pv + V.anc.autres - V.anc.pv * t;
  meth[4].v = [ancC * (1 - V.anc.fourchette), ancC, ancC * (1 + V.anc.fourchette)];
  meth.forEach(m => {
    const f = V.force[m.k];
    m.applicable = f === 'Oui' ? 1 : f === 'Non' ? 0 : (m.k === 'per' ? (ag.rn > 0 ? 1 : 0) : 1);
    m.poids = V.poids[m.k];
  });
  const den = Math.max(meth.reduce((s, m) => s + m.applicable * m.poids, 0), 1e-6);
  meth.forEach(m => {
    m.w = m.applicable * m.poids / den;
    m.contrib = Math.max(0, m.v[1]) * m.w;
    m.statut = m.poids === 0 ? 'Non utilisé (pondération 0)' : !m.applicable
      ? (m.k === 'per' && !V.force.per ? 'Non applicable : résultat net normatif en perte' : 'Non retenu (forcé à Non)')
      : m.v[1] <= 0 ? 'Retenu à 0 : valeur négative' : `Retenu — poids ${Math.round(m.w * 100)} %`;
  });
  const pond = meth.reduce((s, m) => s + m.contrib, 0);
  const apresDlom = pond * (1 - V.dlom);
  const retenue = Math.max(apresDlom, V.plancher ? meth[4].v[1] : 0);
  const side = i => Math.max(meth.reduce((s, m) => s + Math.max(0, m.v[i]) * m.w, 0) * (1 - V.dlom), V.plancher ? meth[4].v[i] : 0);
  const sens = { waccs: [-0.01, -0.005, 0, 0.005, 0.01].map(d => wacc + d), gs: [-0.01, -0.005, 0, 0.005, 0.01].map(d => g + d) };
  sens.grid = sens.waccs.map(w => sens.gs.map(gg => dcfAt(w, gg).eq));
  return { ke, wacc, t, ag, dcf, meth, pond, dlom: pond * V.dlom, apresDlom, retenue,
    plancherApplique: V.plancher && apresDlom < meth[4].v[1], fourchette: [side(0), side(2)], sens };
}

function initFinance(saved) {
  const M = S.M;
  const def = defaultHyp(M);
  if (saved && saved.H && saved.H.base && M.lastMonth('Actuals', saved.H.base) === 12 && saved.H.years.length === def.years.length) {
    S.H = saved.H; S.R = saved.R || defaultRetr(); S.V = Object.assign(defaultVal(), saved.V || {});
  } else { S.H = def; S.R = defaultRetr(); S.V = defaultVal(); }
  recompute();
}
function recompute() {
  if (!S.M || !S.H || !S.M.hasScenario('Actuals')) { S.proj = S.R7 = S.val = null; return; }
  S.proj = project(S.M, S.H);
  S.R7 = retraitements(S.M, S.H, S.R);
  S.val = valuation(S.M, S.H, S.R7, S.V, S.proj);
}

function render() {
  S.charts.forEach(c => c.destroy()); S.charts = [];
  renderShell();
  const fn = VIEWS[S.tab] || VIEWS.overview;
  let out;
  try { out = fn(); } catch (e) { console.error(e); out = { html: `<div class="alert bad">Erreur d'affichage : ${esc(e.message)}</div>` }; }
  $('#view').innerHTML = (S.flash ? `<div class="alert ${S.flash.cls}">${S.flash.html}</div>` : '') + out.html;

  if (out.after) out.after();

function kpi(lab, v, prev, opts = {}) {
  const d = delta(v, prev);
  const good = opts.inverse ? d < 0 : d > 0;
  return `<div class="card kpi"><div class="lab">${lab}</div><div class="val${v < 0 ? ' neg' : ''}">${opts.pct ? pct(v) : fmtK(v)}</div>
    <div class="sub">${Number.isFinite(d) ? `<span class="${good ? 'pos' : 'neg'}">${d > 0 ? '▲' : '▼'} ${pct(Math.abs(d))}</span> vs ${opts.cmpLab || 'N-1'} (${opts.pct ? pct(prev) : fmtK(prev)})` : (opts.sub || '&nbsp;')}</div></div>`;
}

function ratioCell(k, v, u) {
  if (!Number.isFinite(v)) return '<td class="num muted">–</td>';
  const txt = u === '%' ? pct(v) : u === 'x' ? NF2.format(v) + ' x' : u === 'j' ? NF0.format(Math.round(v)) + ' j' : fmt(v) + ' €';
  const r = REPERES[k]; let cls = '';
  if (r) { const [sens, bon, al] = r; const ok = sens === 'haut' ? v >= bon : v <= bon; const bad = sens === 'haut' ? v < al : v > al; cls = ok ? 'b-ok' : bad ? 'b-bad' : 'b-warn'; }
  return `<td class="num">${cls ? `<span class="badge ${cls}">${txt}</span>` : txt}</td>`;
}
function repereTxt(k, u) {
  const r = REPERES[k]; if (!r) return '';
  const f = v => (u === '%' ? pct(v, 1) : u === 'j' ? v + ' j' : NF1.format(v) + ' x');
  return r[0] === 'haut' ? `bon ≥ ${f(r[1])} · alerte < ${f(r[2])}` : `bon ≤ ${f(r[1])} · alerte > ${f(r[2])}`;
}

/* ---------- tableaux génériques ---------- */
function plRows(colsFn, opts = {}) {
  // colsFn(key) -> array of numbers for each column
  let h = '';
  for (const x of PL) {
    if (x.t) {
      h += `<tr class="${x.strong ? 'tot' : 'sub'}"><td>${x.l}</td>${colsFn(x.t).map(v => td(v)).join('')}</tr>`;
      if (x.t === 'ebit') h += `<tr class="sub"><td>EBITDA</td>${colsFn('ebitda').map(v => td(v)).join('')}</tr>`;
      continue;
    }
    const vals = colsFn(x.k);
    if (opts.hideZero && vals.every(v => Math.abs(v) < 0.5)) continue;
    const exp = opts.expand && S.expanded.has(x.k);
    h += `<tr class="${opts.expand ? 'click' + (exp ? ' open' : '') : ''}" ${opts.expand ? `data-exp="${x.k}"` : ''}><td>${x.l}</td>${vals.map(v => td(v)).join('')}</tr>`;
    if (exp && opts.childFn) h += opts.childFn(x);
  }
  return h;
}

function bsRows(colsFn, opts = {}) {
  let h = `<tr class="sec"><td colspan="99">Actif</td></tr>`;
  for (const x of BS) {
    if (x.k === 'p10') h += `<tr class="sec"><td colspan="99">Passif</td></tr>`;
    if (x.t) { h += `<tr class="${x.strong ? 'tot' : 'sub'}"><td>${x.l}</td>${colsFn(x.t).map(v => td(v)).join('')}</tr>`; continue; }
    const vals = colsFn(x.k);
    if (opts.hideZero && vals.every(v => Math.abs(v) < 0.5)) continue;
    h += `<tr><td>${x.l}</td>${vals.map(v => td(v)).join('')}</tr>`;
  }
  if (opts.check) h += `<tr class="check"><td>Contrôle actif − passif (doit être 0)</td>${colsFn('ecart').map(v => td(v)).join('')}</tr>`;
  return h;
}

VIEWS.plm = () => {
  const M = S.M, sc = S.sc, y = S.y, m = S.m, mm = range(1, m), n1 = hasYear(sc, y - 1);

VIEWS.bnb = () => {
  const M = S.M, sc = S.sc, m = S.m, ys = M.yearsOf(sc);
  const all = new Map();
  ys.forEach(y => M.bnb(sc, y, m).forEach(r => {
    let o = all.get(r.nom); if (!o) { o = { ...r, vals: {} }; all.set(r.nom, o); }
    o.vals[y] = r.v; if (r.minAcc < o.minAcc) o.minAcc = r.minAcc;
  }));
  if (!all.size) return { html: `<h1 class="view">BNB (Bilan + P&L)</h1><div class="alert info">La colonne « Rubrique_BNB » est absente ou vide dans ce fichier.</div>` };
  const rows = [...all.values()].sort((a, b) => a.minAcc.localeCompare(b.minAcc));
  const isActif = r => /actif/i.test(r.nat) || /^(2|3|40|41|5|490|491|49[4-9])/.test(r.minAcc);
  const sect = (title, list, sign) => {
    if (!list.length) return '';
    const tot = ys.map(y => list.reduce((s, r) => s + sign(r) * (r.vals[y] || 0), 0));
    return `<tr class="sec"><td colspan="99">${title}</td></tr>` + list.map(r => `<tr><td>${esc(r.nom)}</td>${ys.map(y => td(sign(r) * (r.vals[y] || 0))).join('')}</tr>`).join('') +
      `<tr class="sub"><td>Total ${title.toLowerCase()}</td>${tot.map(v => td(v)).join('')}</tr>`;
  };
  const bil = rows.filter(r => r.cat === 'Bilan'), res = rows.filter(r => r.cat === 'Résultat'), aff = rows.filter(r => r.cat === 'Affectation');
  return { html: `<h1 class="view">BNB (Bilan + P&L)</h1><p class="lead">Regroupement selon la colonne « Rubrique_BNB » de l'export (schéma de la Banque nationale), ${MOIS_C[1]}–${MOIS_C[m]} de chaque exercice. Produits et passifs en positif.</p>
    <div class="card">${tbl(['Rubrique'].concat(ys.map(String)), sect('Actif', bil.filter(isActif), () => 1) + sect('Passif', bil.filter(r => !isActif(r)), () => -1) + sect('Compte de résultats', res, () => -1) + sect('Affectation', aff, () => -1))}</div>` };
};

VIEWS.gl = () => {
  const M = S.M, L = M.L, P = L.pools, G = S.gl;
  const scId = P.sc.map.get(S.sc), socId = M.soc ? P.soc.map.get(M.soc) : -1;
  const txt = G.txt.trim().toLowerCase(), jrId = G.jr ? P.jr.map.get(G.jr) : -1;
  const idx = [];
  for (let i = 0; i < L.n; i++) {
    if (L.sc[i] !== scId || L.y[i] !== S.y || L.m[i] < G.m1 || L.m[i] > G.m2) continue;
    if (socId >= 0 && L.soc[i] !== socId) continue;
    if (G.acc && !P.acc.list[L.acc[i]].startsWith(G.acc)) continue;
    if (jrId >= 0 && L.jr[i] !== jrId) continue;
    if (txt && !(P.lib.list[L.lib[i]] + ' ' + P.tiers.list[L.tiers[i]] + ' ' + P.pc.list[L.pc[i]]).toLowerCase().includes(txt)) continue;
    idx.push(i);
  }
  S.glIdx = idx;
  let d = 0, c = 0; for (const i of idx) { d += L.deb[i]; c += L.cred[i]; }
  const per = 100, pages = Math.max(1, Math.ceil(idx.length / per)); G.page = Math.min(G.page, pages - 1);
  const dt = s => (s ? new Date(Date.UTC(1899, 11, 30) + s * 864e5).toLocaleDateString('fr-BE', { timeZone: 'UTC' }) : '');
  const rows = idx.slice(G.page * per, G.page * per + per).map(i => `<tr><td class="l">${dt(L.date[i])}</td><td class="l">${esc(P.jr.list[L.jr[i]])}</td><td class="l">${esc(P.pc.list[L.pc[i]])}</td><td class="l">${esc(P.acc.list[L.acc[i]])}</td><td class="l">${esc(P.tiers.list[L.tiers[i]])}</td><td class="l">${esc(P.lib.list[L.lib[i]])}</td>${td(L.deb[i])}${td(L.cred[i])}${td(L.mt[i])}</tr>`).join('');
  const jrOpts = ['<option value="">Tous</option>'].concat(P.jr.list.filter(Boolean).map(j => `<option${j === G.jr ? ' selected' : ''}>${esc(j)}</option>`)).join('');
  return { html: `<h1 class="view">Grand livre</h1><p class="lead">Écritures de ${S.y}, scénario ${esc(S.sc)}.</p>
    ${S.aggregated ? '<div class="alert info">Ce dossier a été enregistré sans le détail des écritures : les lignes sont regroupées par mois, compte, journal et tiers (totaux identiques, sans libellés ni pièces).</div>' : ''}
    <div class="toolbar no-print">
      <label>Compte commence par<input id="gl-acc" value="${esc(G.acc)}" placeholder="ex. 61" size="8"></label>
      <label>Texte (libellé, tiers, pièce)<input id="gl-txt" value="${esc(G.txt)}" size="22"></label>
      <label>Journal<select id="gl-jr">${jrOpts}</select></label>
      <label>Du mois<select id="gl-m1">${range(1, 12).map(i => `<option value="${i}"${i === G.m1 ? ' selected' : ''}>${MOIS_C[i]}</option>`).join('')}</select></label>
      <label>Au mois<select id="gl-m2">${range(1, 12).map(i => `<option value="${i}"${i === G.m2 ? ' selected' : ''}>${MOIS_C[i]}</option>`).join('')}</select></label>
      <button class="btn" data-act="gl-csv">Exporter en CSV</button>
    </div>
    <div class="kpis"><div class="card kpi"><div class="lab">Lignes</div><div class="val">${NF0.format(idx.length)}</div></div>
      <div class="card kpi"><div class="lab">Débit</div><div class="val">${fmtK(d)}</div></div><div class="card kpi"><div class="lab">Crédit</div><div class="val">${fmtK(c)}</div></div>
      <div class="card kpi"><div class="lab">Solde (D − C)</div><div class="val">${fmtK(d - c)}</div></div></div>
    <div class="card"><div class="tw"><table class="t"><thead><tr><th class="l">Date</th><th class="l">Journal</th><th class="l">Pièce</th><th class="l">Compte</th><th class="l">Tiers</th><th class="l">Libellé</th><th>Débit</th><th>Crédit</th><th>Montant</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="toolbar no-print" style="margin-top:10px"><button class="btn small" data-act="gl-prev"${G.page ? '' : ' disabled'}>‹ Précédent</button><span class="muted">Page ${G.page + 1} / ${pages}</span><button class="btn small" data-act="gl-next"${G.page < pages - 1 ? '' : ' disabled'}>Suivant ›</button></div></div>` };
};
