const coFv = (D, id) => (D.factors && Number.isFinite(D.factors[id]) ? D.factors[id] : CO_F[id] ? CO_F[id][2] : 0);
function coCalc(D) {
  const L = [];   // { scope, cat, poste, lib, q, unit, f, kg, kind:'act'|'sp' }
  const add = (scope, cat, poste, lib, fid, q, kind = 'act') => { q = numIn(q); if (!q || !CO_F[fid]) return; const f = coFv(D, fid); L.push({ scope, cat, poste, lib, fid, q, unit: CO_F[fid][1], f, kg: q * f, kind }); };
  let locKg = 0, elecKwh = 0;
  for (const r of D.elec) { const q = numIn(r.kwh); elecKwh += q; locKg += q * coFv(D, 'elec_loc'); add(2, 0, 'Électricité', r.site || 'Électricité', r.contrat || 'elec_grise', q); }
  for (const r of D.comb) add(1, 0, 'Combustibles (chauffage)', r.lib || CO_F[r.f]?.[0], r.f, r.q);
  for (const r of D.flotte) add(r.f === 'car_elec' ? 2 : 1, 0, r.f === 'car_elec' ? 'Recharge des véhicules électriques' : 'Véhicules de l\'entreprise', r.lib || CO_F[r.f]?.[0], r.f, r.q);
  for (const r of D.froid) add(1, 0, 'Fuites de fluides frigorigènes', r.lib || CO_F[r.f]?.[0], r.f, r.q);
  for (const r of D.voy) add(3, 6, r.f === 'hotel_be' ? 'Hébergement' : 'Déplacements professionnels', r.lib || CO_F[r.f]?.[0], r.f, r.q);
  for (const r of D.dt) add(3, 7, 'Domicile-travail', `${CO_F[r.f]?.[0] || ''} — ${nfx(numIn(r.pers))} pers. × ${nfx(numIn(r.km))} km × ${nfx(numIn(r.jours))} j`, r.f, numIn(r.pers) * numIn(r.km) * numIn(r.jours));
  for (const r of D.fret) add(3, 4, 'Fret amont', r.lib || CO_F[r.f]?.[0], r.f, r.q);
  for (const r of D.dech) add(3, 5, 'Déchets', r.lib || CO_F[r.f]?.[0], r.f, r.q);
  add(3, 1, 'Eau', 'Eau de distribution', 'eau', D.eau);
  const cpi = numIn(D.params.cpi) || 1;
  for (const r of D.achats) if (r.cat !== 'sp_excl') add(3, 1, 'Achats de biens et services', `${r.lib || CO_F[r.cat]?.[0]}${r.compte ? ' (' + r.compte + ')' : ''}`, r.cat, numIn(r.montant) / cpi, 'sp');
  for (const r of D.immos) if (r.cat !== 'sp_excl') add(3, 2, 'Biens d\'immobilisation', `${r.lib || CO_F[r.cat]?.[0]}${r.compte ? ' (' + r.compte + ')' : ''}`, r.cat, numIn(r.montant) / cpi, 'sp');
  const tot = L.reduce((s, x) => s + x.kg, 0);
  const sc = [1, 2, 3].map(s => L.filter(x => x.scope === s).reduce((a, x) => a + x.kg, 0));
  const postes = new Map(); for (const x of L) postes.set(x.poste, (postes.get(x.poste) || 0) + x.kg);
  const posteList = [...postes.entries()].sort((a, b) => b[1] - a[1]);
  const cats = new Map(); for (const x of L.filter(x => x.scope === 3)) cats.set(x.cat, (cats.get(x.cat) || 0) + x.kg);
  const spKg = L.filter(x => x.kind === 'sp').reduce((s, x) => s + x.kg, 0);
  const unc = Math.sqrt(L.reduce((s, x) => s + (x.kg * CO_UNC[x.kind]) ** 2, 0));

  const marketElecKg = L.filter(x => x.poste === 'Électricité').reduce((s, x) => s + x.kg, 0);
  return { L, tot, sc, posteList, cats, spKg, unc, etp, ca, locKg, elecKwh, marketElecKg, totLoc: tot - marketElecKg + locKg };

function coLevers(D, C) {
  const out = [], sum = pred => C.L.filter(pred).reduce((s, x) => s + x.kg, 0);
  const grise = sum(x => x.poste === 'Électricité' && x.fid !== 'elec_verte');
  if (grise > 0) out.push(['Contrat d\'électricité verte (garanties d\'origine belges) ou panneaux photovoltaïques', 'Scope 2', grise, 'Supprime les émissions market-based de l\'électricité achetée ; le location-based ne change pas.']);
  const gaz = sum(x => x.fid === 'gaz' || x.fid === 'mazout' || x.fid === 'propane');
  if (gaz > 0) out.push(['Isolation, régulation du chauffage, puis pompe à chaleur', 'Scope 1', gaz * 0.6, 'Ordre de grandeur : −20 à −30 % par isolation et régulation, jusqu\'à −65 % avec une pompe à chaleur (gaz 0,18 kg/kWh contre 0,19 / COP 3 ≈ 0,06 kg/kWh).']);
  const fl = sum(x => ['diesel_l', 'essence_l', 'lpg_l', 'car_diesel', 'car_essence', 'car_hybride', 'van_diesel'].includes(x.fid) && x.scope === 1);
  if (fl > 0) out.push(['Électrification progressive de la flotte et écoconduite', 'Scope 1', fl * 0.5, 'Une voiture électrique émet environ 0,03 kg/km contre 0,17 kg/km en diesel (−83 %) ; potentiel affiché pour la moitié de la flotte.']);
  const fr = sum(x => x.poste === 'Fuites de fluides frigorigènes');
  if (fr > 0) out.push(['Contrôle d\'étanchéité et fluide à faible PRG (R32, R290) au remplacement', 'Scope 1', fr * 0.7, 'Le R410A a un PRG de 1 924 contre 677 pour le R32 et environ 3 pour le R290.']);
  const av = sum(x => x.fid === 'avion_cc_eco' || x.fid === 'avion_cc_aff');
  if (av > 0) out.push(['Remplacer les vols de moins de 800 km par le train ; visioconférence', 'Scope 3 — cat. 6', av * 0.5 * (1 - 0.01135 / 0.12576), 'Train international ≈ 0,011 kg/passager·km contre 0,126 en avion court-courrier ; potentiel affiché pour la moitié des vols court-courriers.']);
  const dt = sum(x => x.cat === 7);
  if (dt > 0) out.push(['Plan de mobilité : télétravail, vélo, abonnements de train, covoiturage', 'Scope 3 — cat. 7', dt * 0.2, 'Potentiel indicatif de −20 % (un jour de télétravail par semaine ≈ −20 % des trajets).']);
  const ach = sum(x => x.cat === 1 && x.kind === 'sp');
  if (ach > 0) out.push(['Achats responsables : questionnaire carbone fournisseurs, produits à faible empreinte, durée de vie', 'Scope 3 — cat. 1', ach * 0.1, 'Potentiel indicatif de −10 % ; demander les données réelles des principaux fournisseurs améliore aussi la précision du bilan.']);
  const fret = sum(x => x.cat === 4);
  if (fret > 0) out.push(['Optimiser le fret : regrouper les livraisons, report modal vers le rail', 'Scope 3 — cat. 4', fret * 0.15, 'Le rail électrique émet ≈ 0,011 kg/t·km contre 0,107 kg/t·km en camion.']);
  return out.sort((a, b) => b[2] - a[2]);
}

/* ------------------------------------------------------------- import GL -- */
const CO_GLMAP = [
  [/^610/, 'sp_excl', 'Loyers et charges locatives'], [/^611/, 'sp_constr', 'Entretien et réparations'], [/^612/, 'sp_excl', 'Fournitures (énergie, eau…) — saisir les consommations'],
  [/^613/, 'sp_conseil', 'Rétributions de tiers, honoraires'], [/^61/, 'sp_conseil', 'Services et biens divers'], [/^60/, 'sp_manuf', 'Approvisionnements et marchandises'],
  [/^21/, 'sp_it_serv', 'Immobilisations incorporelles (logiciels)'], [/^22|^27/, 'sp_constr', 'Constructions, immobilisations en cours'], [/^240/, 'sp_it_hw', 'Mobilier et matériel de bureau'],
  [/^24|^25/, 'sp_vehic', 'Matériel roulant, location-financement'], [/^23|^26/, 'sp_manuf', 'Installations, machines, autres immobilisations'],
];
function coFromGl(D, year) {
  const M = S.M, L = M.L, P = L.pools, sc = P.sc.map.get('Actuals'), opId = M.opening ? P.jr.map.get(M.opening) : -1;
  const socId = M.soc ? P.soc.map.get(M.soc) : -1;
  const ach = new Map(), imm = new Map();
  for (let i = 0; i < L.n; i++) {
    if (L.sc[i] !== sc || L.y[i] !== year || L.jr[i] === opId || (socId >= 0 && L.soc[i] !== socId)) continue;
    const a = P.acc.list[L.acc[i]];
    if (/^6[01]/.test(a)) { const k = a.slice(0, 3); ach.set(k, (ach.get(k) || 0) + L.mt[i]); }
    else if (/^2[1-7]/.test(a) && a[3] !== '9' && a.slice(2, 3) !== '9') { const k = a.slice(0, 3); imm.set(k, (imm.get(k) || 0) + L.deb[i]); }
  }
  const row = (k, v) => { const m = CO_GLMAP.find(([re]) => re.test(k)) || [null, 'sp_conseil', 'Autres']; return { lib: m[2], compte: k, montant: Math.round(v), cat: m[1] }; };
  D.achats = [...ach.entries()].filter(([, v]) => v > 0.5).sort().map(([k, v]) => row(k, v));
  D.immos = [...imm.entries()].filter(([, v]) => v > 0.5).sort().map(([k, v]) => row(k, v));
  D.meta.annee = year; D.params.cpi = CO_CPI[year] || D.params.cpi;
  const pl = M.pl('Actuals', year); if (pl.ca) D.meta.ca = Math.round(pl.ca);
  return { n: D.achats.length + D.immos.length, tot: [...ach.values()].reduce((s, v) => s + v, 0) };
}

const coSelF = g => CO_GROUP(g);
function coRowsTable(D, list, groups, qLabel, opts = {}) {
  const sel = [].concat(...groups.map(coSelF));
  return editTable(D, list, [
    { k: 'f', l: opts.typeLabel || 'Type', sel }, { k: 'lib', l: 'Description' }, { k: 'q', l: qLabel, num: true, w: '130px' },

    { k: '_kg', l: 'Émissions', calc: r => tCO(numIn(r.q) * coFv(D, r.f)) }], { empty: opts.empty });
}
function coSectionTotal(C, pred) { return C.L.filter(pred).reduce((s, x) => s + x.kg, 0); }

function bceNorm(v) {
  let d = String(v || '').toUpperCase().replace(/^BE/, '').replace(/\D/g, '');
  if (d.length === 9) d = '0' + d;

  if (r.status === 429) throw new NetError('Trop de demandes : réessayez dans quelques minutes.');

    if (Array.isArray(o)) { o.forEach(x => walk(x, depth + 1)); return; }
    const code = pickKey(o, /^(code|rubric|rubriccode|rubrique)$/i), val = pickKey(o, /^(value|amount|montant|valeur)$/i);
    if (code !== undefined && val !== undefined && typeof code !== 'object' && typeof val !== 'object') {
      const per = String(pickKey(o, /period/i) ?? 'N');
      const k = String(code).trim(); if (!found.has(k)) found.set(k, {});
      const n = Number(String(val).replace(',', '.')); if (Number.isFinite(n)) found.get(k)[/1|prev|previous|nm1/i.test(per) ? 'n1' : 'n'] = n;
    }
    Object.values(o).forEach(x => walk(x, depth + 1));
  };
  walk(j, 0);
  return KEY_CODES.map(([c, l]) => ({ c, l, ...(found.get(c) || {}) })).filter(x => x.n !== undefined || x.n1 !== undefined);
}

const blobToB64 = b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });
function b64ToBlob(u) {
  const [h, b] = u.split(','), mime = (/data:([^;]+)/.exec(h) || [])[1] || 'application/octet-stream';
  const bin = atob(b), arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function backupAll(pw) {
  const ls = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('altesia') && k !== ENT_KEY_NBB) ls[k] = localStorage.getItem(k); }
  const dossiers = (await idbDo('readonly', st => st.getAll()).catch(() => [])) || [];
  const ents = await entList();
  for (const e of ents) {
    for (const d of Object.values(e.docs || {})) if (d.pdf instanceof Blob) d.pdf = { b64: await blobToB64(d.pdf) };
    for (const f of e.files || []) if (f.blob instanceof Blob) f.blob = { b64: await blobToB64(f.blob) };
  }
  return buildDossier({ v: 1, kind: 'sauvegarde', savedAt: new Date().toISOString(), ls, dossiers, ents }, pw);
}
async function restoreAll(file, pw) {
  const o = await readDossierAny(file, pw);
  if (o.kind !== 'sauvegarde') throw new Error("Ce fichier n'est pas une sauvegarde complète de la suite.");
  for (const [k, v] of Object.entries(o.ls || {})) localStorage.setItem(k, v);
  for (const r of o.dossiers || []) await memSave(r);
  for (const e of o.ents || []) {
    for (const d of Object.values(e.docs || {})) if (d.pdf && d.pdf.b64) d.pdf = b64ToBlob(d.pdf.b64);
    for (const f of e.files || []) if (f.blob && f.blob.b64) f.blob = b64ToBlob(f.blob.b64);
    await idbDo('readwrite', st => st.put(e), 'entreprises');
  }
  EXA = null; // fiche des tiers rechargée
  return { d: (o.dossiers || []).length, e: (o.ents || []).length, at: o.savedAt };
}
/** readDossier exige des écritures ; la sauvegarde n'en a pas. */
async function readDossierAny(file, pw) {
  const buf = new Uint8Array(await file.arrayBuffer());
  if (!MAGIC.every((b, i) => buf[i] === b)) throw new Error("Ce fichier n'est pas une sauvegarde Altesia Finance.");
  let gz;
  if (buf[4] === 1) {
    try { gz = new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.subarray(21, 33) }, await deriveKey(pw || '', buf.subarray(5, 21)), buf.subarray(33))); }
    catch (e) { throw new Error('Mot de passe incorrect.'); }
  } else gz = buf.subarray(5);
  return JSON.parse(new TextDecoder().decode(await streamBytes(gz, new DecompressionStream('gzip'))));
}
async function storageStatus() {
  const out = { persisted: null, usage: null, quota: null };
  try { if (navigator.storage) { out.persisted = navigator.storage.persisted ? await navigator.storage.persisted() : null; const e = navigator.storage.estimate ? await navigator.storage.estimate() : {}; out.usage = e.usage; out.quota = e.quota; } } catch (e) { /* */ }
  return out;
}

async function wipeAll(withKey) {

}

    case 'ent-del': if (rec && window.confirm(`Supprimer la fiche ${rec.nom || bceFmt(rec.id)} et ses documents de cet ordinateur ?`)) { await entDel(rec.id); S.ent = null; entSetActive(''); S.entMsg = null; home(); } break;
    case 'ent-dl': entDownload('all'); break;
    case 'ent-get-pdf': entFetchDoc(b.dataset.ref, 'pdf'); break;
    case 'ent-get-json': entFetchDoc(b.dataset.ref, 'json'); break;
    case 'ent-open-pdf': { const d = rec.docs[b.dataset.ref]; if (d && d.pdf) openBlob(d.pdf, `${rec.id}_${b.dataset.ref}.pdf`); break; }
    case 'ent-open-file': { const f = rec.files[+b.dataset.i]; if (f && f.blob) openBlob(f.blob, f.name); break; }
    case 'ent-rm-file': rec.files.splice(+b.dataset.i, 1); await entPut(rec); home(); break;
    case 'ent-files': { const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true; inp.accept = '.pdf,.json,.xbrl,.xml,.zip,.csv,.xlsx';
      inp.onchange = () => { if (inp.files.length) entAddFiles([...inp.files]); }; inp.click(); break; }
    case 'ent-key': entKeyDialog(); break;
    case 'ent-key-save': { const k = $('#nbb-key').value.trim(); try { k ? localStorage.setItem(ENT_KEY_NBB, k) : localStorage.removeItem(ENT_KEY_NBB); } catch (err) { /* */ } closeDialog(); S.entMsg = { cls: 'ok', html: 'Clé enregistrée sur cet ordinateur.' }; home(); break; }
    case 'ent-new': {
      const app = b.dataset.app; S.app = app; const all = modLoad(app);
      const ex = Object.values(all.docs).filter(d => d.meta.tva === rec.id).sort((x, y) => y.meta.updated.localeCompare(x.meta.updated))[0];
      if (ex) { modState(app).cur = ex.meta.id; modState(app).tab = null; modRender(); }
      else { modNew(rec.nom || bceFmt(rec.id)); const D = modDoc(); D.meta.tva = rec.id; modPut(D); modRender(); }
      window.scrollTo(0, 0); break;
    }
    case 'bk-save': bkDialog('save'); break;
    case 'bk-restore': bkDialog('restore'); break;
    case 'bk-persist': { try { const ok = await navigator.storage.persist(); S.entMsg = { cls: ok ? 'ok' : 'info', html: ok ? 'Le navigateur ne videra plus automatiquement ces données.' : 'Le navigateur a refusé la protection (fréquent pour un fichier ouvert depuis le disque) : faites des sauvegardes régulières.' }; } catch (err) { /* */ } home(); break; }
    case 'bk-save-go': {
      const pw = $('#bk-pw').value, msg = $('#dlg-msg');
      if (pw !== $('#bk-pw2').value) { msg.innerHTML = '<div class="alert bad">Les mots de passe ne correspondent pas.</div>'; break; }
      msg.innerHTML = '<div class="alert info">Création de la sauvegarde…</div>';
      try { const blob = await backupAll(pw); openBlob(blob, `Altesia_Finance_sauvegarde_${new Date().toISOString().slice(0, 10)}.afsauvegarde`);
        localStorage.setItem('altesia-derniere-sauvegarde', new Date().toISOString());
        msg.innerHTML = `<div class="alert ok">Sauvegarde créée (${nfx(blob.size / 1024)} Ko)${pw ? ', chiffrée' : ''}.</div>`; setTimeout(() => { closeDialog(); home(); }, 1400); }
      catch (err) { msg.innerHTML = `<div class="alert bad">${esc(err.message)}</div>`; }
      break;
    }
    case 'bk-wipe': wipeDialog(); break;
    case 'bk-wipe-go': {
      const msg = $('#dlg-msg');
      if (($('#wipe-confirm').value || '').trim().toUpperCase() !== 'EFFACER') { msg.innerHTML = '<div class="alert bad">Tapez EFFACER pour confirmer.</div>'; break; }
      try { const n = await wipeAll($('#wipe-key').checked); closeDialog();
        S.entMsg = { cls: 'ok', html: `Toutes les données de la suite ont été effacées de ce navigateur (${n} élément${n > 1 ? 's' : ''}). Vos fichiers (sauvegardes, exports, grands livres) ne sont pas touchés.` }; home(); }
      catch (err) { msg.innerHTML = `<div class="alert bad">${esc(err.message)}</div>`; }
      break;
    }
    case 'bk-restore-go': {
      const f = $('#bk-file').files[0], msg = $('#dlg-msg'); if (!f) { msg.innerHTML = '<div class="alert bad">Choisissez le fichier .afsauvegarde.</div>'; break; }
      msg.innerHTML = '<div class="alert info">Restauration…</div>';
      try { const r = await restoreAll(f, $('#bk-rpw').value); closeDialog(); S.ent = null; S.entMsg = { cls: 'ok', html: `Sauvegarde du ${new Date(r.at).toLocaleString('fr-BE')} restaurée : ${r.d} dossier(s) de grand livre, ${r.e} fiche(s) entreprise, diagnostics, bilans carbone et réglages.` }; home(); }
      catch (err) { msg.innerHTML = `<div class="alert bad">${esc(err.message)}</div>`; }
      break;
    }
  }
});

</script>
</body>
</html>
